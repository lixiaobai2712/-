  /* ═══════════════════════════════════════════
   *  每日工作登记
   * ═══════════════════════════════════════════ */
  var WORKLOG_KEY = 'my_worklog';
  var worklogData = {};      // { '2026-05-20': '内容...', ... }
  var worklogActive = '';    // 当前查看的日期 '2026-05-20'
  var worklogTimer = null;   // 输入防抖
  var worklogPage = 0;       // 当前页码（0=最新页）
  var WORKLOG_PER_PAGE = 7;

  function loadWorklog() {
    try {
      var raw = localStorage.getItem(WORKLOG_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
          worklogData = parsed;
        } else {
          worklogData = {};
        }
      }
    } catch (e) { worklogData = {}; }
  }

  function saveWorklog() {
    saveWithBackup(WORKLOG_KEY, JSON.stringify(worklogData));
  }

  function renderWorklogTabs() {
    var container = document.getElementById('worklogTabs');
    var today = todayStr();
    var allDates = Object.keys(worklogData).filter(function(d) { return d !== today; });
    allDates.sort(function(a, b) { return b.localeCompare(a); }); // 降序
    var totalDates = [today].concat(allDates); // 今天始终第一位

    // 计算总页数 & 边界修正
    var totalPages = Math.ceil(totalDates.length / WORKLOG_PER_PAGE);
    if (totalPages === 0) totalPages = 1;
    if (worklogPage < 0) worklogPage = 0;
    if (worklogPage >= totalPages) worklogPage = totalPages - 1;

    // 切片当前页
    var start = worklogPage * WORKLOG_PER_PAGE;
    var pageDates = totalDates.slice(start, start + WORKLOG_PER_PAGE);

    var html = '';
    // ◀ 按钮
    html += '<button class="worklog-nav"' + (worklogPage <= 0 ? ' disabled' : '') + ' data-wl-nav="-1">◀</button>';
    // 日期标签
    pageDates.forEach(function(d) {
      var label = d === today ? '今天' : d.replace(/^\d{4}-(\d{2})-(\d{2})$/, '$1/$2');
      var cls = 'worklog-tab' + (d === worklogActive ? ' active' : '');
      html += '<span class="' + cls + '" data-date="' + d + '">' + label + '</span>';
    });
    // ▶ 按钮
    html += '<button class="worklog-nav"' + (worklogPage >= totalPages - 1 ? ' disabled' : '') + ' data-wl-nav="1">▶</button>';

    container.innerHTML = html;
  }

  function renderWorklogContent() {
    var textarea = document.getElementById('worklogTextarea');
    var content = worklogData[worklogActive] || '';
    textarea.value = content;
    if (worklogActive === todayStr()) {
      textarea.removeAttribute('readonly');
      textarea.placeholder = '记录今天做了什么...';
    } else {
      textarea.setAttribute('readonly', '');
      textarea.placeholder = '';
    }
  }

  function switchWorklogDate(date) {
    worklogActive = date;
    // 自动定位到该日期所在页
    var today = todayStr();
    var allDates = Object.keys(worklogData).filter(function(d) { return d !== today; });
    allDates.sort(function(a, b) { return b.localeCompare(a); });
    var totalDates = [today].concat(allDates);
    var idx = totalDates.indexOf(date);
    if (idx >= 0) {
      worklogPage = Math.floor(idx / WORKLOG_PER_PAGE);
    }
    renderWorklogTabs();
    renderWorklogContent();
  }

  document.getElementById('worklogTabs').addEventListener('click', function(e) {
    var nav = e.target.closest('.worklog-nav');
    if (nav && !nav.disabled) {
      worklogPage += parseInt(nav.dataset.wlNav, 10);
      renderWorklogTabs();
      return;
    }
    var tab = e.target.closest('.worklog-tab');
    if (!tab) return;
    switchWorklogDate(tab.dataset.date);
  });

  document.getElementById('worklogTextarea').addEventListener('input', function() {
    if (worklogActive !== todayStr()) return;
    clearTimeout(worklogTimer);
    var self = this;
    worklogTimer = setTimeout(function() {
      worklogData[todayStr()] = self.value;
      if (self.value.trim() === '') {
        delete worklogData[todayStr()];
      }
      saveWorklog();
      if (self.value.trim() !== '' && !Object.prototype.hasOwnProperty.call(worklogData, worklogActive)) {
        renderWorklogTabs();
      }
    }, 400);
  });

  // 任务完成时自动追加到今日工作登记
  function appendCompletedToWorklog(taskText) {
    var today = todayStr();
    var content = worklogData[today] || '';
    // 找到现有最大序号
    var lines = content.split('\n');
    var maxNum = 0;
    lines.forEach(function(line) {
      var m = line.match(/^(\d+)\.\s/);
      if (m) {
        var n = parseInt(m[1], 10);
        if (n > maxNum) maxNum = n;
      }
    });
    var nextNum = maxNum + 1;
    var newLine = nextNum + '. ' + taskText;
    if (content.trim() === '') {
      worklogData[today] = newLine;
    } else {
      worklogData[today] = content.replace(/\n*$/, '') + '\n' + newLine;
    }
    saveWorklog();
    // 如果当前正在看今天，刷新 textarea
    if (worklogActive === today) {
      renderWorklogContent();
    }
    // 确保今天的标签出现
    renderWorklogTabs();
  }

  /* ═══════════════════════════════════════════
   *  明天要说的话
   * ═══════════════════════════════════════════ */
  var TOMORROW_KEY = 'my_tomorrow_msg';
  var tomorrowMsg = '';       // { date: '2026-05-21', text: '...' }
  var TOMORROW_DISMISS = 'my_tomorrow_dismiss';

  function loadTomorrow() {
    try {
      var raw = localStorage.getItem(TOMORROW_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object' && !Array.isArray(parsed) && parsed.date && parsed.text !== undefined) {
          tomorrowMsg = parsed;
        } else {
          tomorrowMsg = null;
        }
      }
    } catch (e) { tomorrowMsg = null; }
  }

  function saveTomorrow() {
    saveWithBackup(TOMORROW_KEY, JSON.stringify(tomorrowMsg));
  }

  function renderTomorrow() {
    var textarea = document.getElementById('tomorrowTextarea');
    var today = todayStr();
    // 如果存储的消息目标日期就是今天，展示在 textarea 中（但不可编辑是昨天的留言）
    if (tomorrowMsg && tomorrowMsg.date === today) {
      textarea.value = tomorrowMsg.text;
    } else if (tomorrowMsg && tomorrowMsg.date > today) {
      // 未来日期的消息还在
      textarea.value = tomorrowMsg.text;
    } else {
      textarea.value = '';
    }
  }

  document.getElementById('tomorrowTextarea').addEventListener('input', function() {
    var today = todayStr();
    var tomorrowDate = new Date();
    tomorrowDate.setDate(tomorrowDate.getDate() + 1);
    var target = localDateStr(tomorrowDate);

    var text = this.value;
    if (text.trim() === '') {
      tomorrowMsg = null;
    } else {
      tomorrowMsg = { date: target, text: text };
    }
    saveTomorrow();
  });

  // 弹窗：检查是否有昨天留给今天的消息 + 未完成任务
  function checkTomorrowModal() {
    var today = todayStr();
    var yesterday = getYesterdayStr();

    // 昨天留给今天的消息
    var hasMessage = tomorrowMsg && tomorrowMsg.date === today && tomorrowMsg.text.trim() !== '';
    // 昨天未完成的任务
    var yesterdayIds = todayData[yesterday] || [];
    var unfinishedTasks = [];
    yesterdayIds.forEach(function(id) {
      var idx = findTodoIndexById(id);
      if (idx >= 0 && !todos[idx].done) unfinishedTasks.push(todos[idx]);
    });
    var hasUnfinished = unfinishedTasks.length > 0;

    if (!hasMessage && !hasUnfinished) return;

    // 检查今天是否已经关闭过弹窗
    var dismissed = localStorage.getItem(TOMORROW_DISMISS);
    if (dismissed === today) return;

    // 填充弹窗内容
    if (hasUnfinished) {
      var listHtml = unfinishedTasks.map(function(t) {
        return '<li>' + escapeHtml(t.text) + '</li>';
      }).join('');
      document.getElementById('modalUnfinishedList').innerHTML = listHtml;
      document.getElementById('modalUnfinished').style.display = '';
    } else {
      document.getElementById('modalUnfinished').style.display = 'none';
    }

    if (hasMessage && hasUnfinished) {
      document.getElementById('modalTitle').textContent = '📩 来自昨天的提醒';
    } else if (hasUnfinished) {
      document.getElementById('modalTitle').textContent = '⚠️ 昨天有未完成的任务';
    } else {
      document.getElementById('modalTitle').textContent = '📩 昨天的你留了一句话';
    }

    if (hasMessage) {
      document.getElementById('modalMessage').textContent = tomorrowMsg.text;
      document.getElementById('modalMessage').style.display = '';
    } else {
      document.getElementById('modalMessage').style.display = 'none';
    }

    document.getElementById('tomorrowModal').classList.add('show');
  }

  document.getElementById('modalConfirm').addEventListener('click', function() {
    document.getElementById('tomorrowModal').classList.remove('show');
    try { localStorage.setItem(TOMORROW_DISMISS, todayStr()); } catch(e) {}
  });

  /* ═══════════════════════════════════════════
   *  思路整理侧边栏（左侧编辑 + 右侧日期列表，手动切换，自动存档）
   *  存储格式：my_ideas = {"2026-10-16": {"text": "内容", "ts": 1697531400000}, ...}
   *  ts = 最后修改时间戳（毫秒），悬停日期标签可见
   *  兼容旧格式：纯字符串整体 → 迁到今天；字符串值 → 迁移为 {text, ts}
   * ═══════════════════════════════════════════ */
  var IDEAS_KEY = 'my_ideas';
  var IDEAS_OPEN_KEY = 'my_ideas_open';
  var IDEAS_POS_KEY = 'my_ideas_pos';   // 记住手动选中的日期
  var IDEAS_DRAWER_W = 430;             // 与 CSS .ideas-drawer 宽度一致
  var ideasTimer = null;
  var ideasCurrentDate = todayStr();   // 当前查看/编辑的日期（YYYY-MM-DD）

  function ideasPad(n) { return n < 10 ? '0' + n : '' + n; }

  function ideasToKey(d) { return d.getFullYear() + '-' + ideasPad(d.getMonth() + 1) + '-' + ideasPad(d.getDate()); }

  function ideasFmtTime(ts) {
    // 格式化为 "x月x日 HH:MM"（今天只显示 HH:MM）
    try {
      var d = new Date(ts);
      var now = new Date();
      var hm = ideasPad(d.getHours()) + ':' + ideasPad(d.getMinutes());
      if (d.toDateString() === now.toDateString()) return '今天 ' + hm;
      return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + hm;
    } catch(e) { return ''; }
  }

  function loadIdeasStore() {
    var store = {};
    try {
      var raw = localStorage.getItem(IDEAS_KEY);
      if (raw !== null) {
        var parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
          // 兼容两种对象值：{date: "字符串"} 旧版 或 {date: {text,ts}} 新版
          var needMigrate = false;
          Object.keys(parsed).forEach(function(k) {
            var v = parsed[k];
            if (v && typeof v === 'object' && typeof v.text === 'string') {
              store[k] = { text: v.text, ts: typeof v.ts === 'number' ? v.ts : Date.now() };
            } else if (typeof v === 'string') {
              if (v.trim() !== '') {
                store[k] = { text: v, ts: Date.now() };
                needMigrate = true;
              }
            } else if (v && typeof v.text !== 'undefined') {
              store[k] = { text: String(v.text), ts: typeof v.ts === 'number' ? v.ts : Date.now() };
              needMigrate = true;
            }
          });
          if (needMigrate) ideasSaveStore(store);  // 迁移后立即落盘
        } else if (typeof parsed === 'string') {
          // 旧格式：my_ideas 整体是纯字符串 → 迁到今天
          if (parsed.trim() !== '') {
            store[ideasCurrentDate] = { text: parsed, ts: Date.now() };
            ideasSaveStore(store);
          }
        }
      }
    } catch(e) { console.error('loadIdeasStore:', e); }
    return store;
  }

  function ideasSaveStore(store) {
    try { saveWithBackup(IDEAS_KEY, JSON.stringify(store)); } catch(e) {}
  }

  // 右侧日期列表：今天固定第一行，其余按日期倒序（有记录的日期只出现一次）
  function ideasRenderList() {
    var el = document.getElementById('ideasDateList');
    if (!el) return;
    var store = loadIdeasStore();
    var today = todayStr();
    var dates = Object.keys(store).filter(function(d) {
      return store[d] && typeof store[d].text === 'string' && store[d].text.trim() !== '';
    }).filter(function(d) { return d !== today; }).sort().reverse();
    dates.unshift(today);   // 今天始终可写，即使还没有记录
    var html = '';
    dates.forEach(function(d) {
      var rec = store[d];
      var isToday = (d === today);
      var label = isToday ? ('今天 · ' + d) : d;
      var sub = (rec && rec.ts) ? ideasFmtTime(rec.ts) : '未记录';
      var safeDate = escapeHtml(d).replace(/"/g, '&quot;');
      var safeTitle = escapeHtml(label).replace(/"/g, '&quot;');
      html += '<div class="ideas-date-item' + (d === ideasCurrentDate ? ' active' : '') +
              '" data-date="' + safeDate + '" title="' + safeTitle + '">' +
                '<div class="d">' + (isToday ? '今天' : escapeHtml(d)) + '</div>' +
                '<div class="t">' + escapeHtml(sub) + '</div>' +
              '</div>';
    });
    el.innerHTML = html;
    var active = el.querySelector('.ideas-date-item.active');
    if (active && active.scrollIntoView) {
      try { active.scrollIntoView({ block: 'nearest' }); } catch(e) {}
    }
  }

  function ideasLoadPage(date) {
    // 载入指定日期的内容（只更新编辑区与右侧列表，不跳页）
    ideasCurrentDate = date;
    var store = loadIdeasStore();
    var rec = store[date];
    var text = (rec && typeof rec.text === 'string') ? rec.text : '';
    document.getElementById('ideasTextarea').value = text;
    ideaRenderIntoEditor();
    var isToday = (date === todayStr());
    document.getElementById('ideasDateLabel').textContent =
      isToday ? ('今天 · ' + date) : date;
    document.getElementById('ideasToday').disabled = isToday;
    try { localStorage.setItem(IDEAS_POS_KEY, date); } catch(e) {}
    ideasRenderList();
  }

  function ideasSavePage() {
    // 存到“当前选中的日期”（编辑旧日期不会新建日期），更新最后修改时间
    var store = loadIdeasStore();
    var ta = document.getElementById('ideasTextarea');
    // 真源始终是隐藏 textarea（由 contenteditable input 事件同步进来）
    var val = ta.value;
    if (val.trim() === '') {
      delete store[ideasCurrentDate];
    } else {
      store[ideasCurrentDate] = {
        text: val,
        ts: Date.now()   // 每次改动刷新最后修改时间，但日期键始终不变
      };
    }
    ideasSaveStore(store);
    ideasRenderList();
  }

  function ideasGoToday() {
    ideasSavePage();
    ideasLoadPage(todayStr());
  }

  function loadIdeas() {
    try {
      // 记住手动选中的日期；记录已被清空的旧位置回退到今天
      var pos = null;
      try { pos = localStorage.getItem(IDEAS_POS_KEY); } catch(e) {}
      var store = loadIdeasStore();
      if (!pos || (pos !== todayStr() &&
          !(store[pos] && typeof store[pos].text === 'string' && store[pos].text.trim()))) {
        pos = todayStr();
      }
      ideasLoadPage(pos);
      var open = localStorage.getItem(IDEAS_OPEN_KEY);
      if (open === 'true') {
        document.getElementById('ideasDrawer').classList.add('open');
        document.getElementById('ideasToggle').textContent = '▶';
        document.getElementById('ideasToggle').style.right = IDEAS_DRAWER_W + 'px';
      }
    } catch(e) { console.error('loadIdeas:', e); }
  }

  function saveIdeas() {
    try { ideasSavePage(); } catch(e) {}
  }

  function toggleIdeas() {
    var drawer = document.getElementById('ideasDrawer');
    var toggle = document.getElementById('ideasToggle');
    var open = drawer.classList.toggle('open');
    toggle.textContent = open ? '▶' : '◀';
    toggle.style.right = open ? (IDEAS_DRAWER_W + 'px') : '0';
    try { localStorage.setItem(IDEAS_OPEN_KEY, String(open)); } catch(e) {}
  }

  document.getElementById('ideasToggle').addEventListener('click', toggleIdeas);
  document.getElementById('ideasClose').addEventListener('click', toggleIdeas);
  // contenteditable 是唯一输入区：输入时同步真源，语法闭合（]] 或行首标记）后重排
  document.getElementById('ideasEditor').addEventListener('input', function() {
    clearTimeout(ideasTimer);
    var ta = document.getElementById('ideasTextarea');
    if (!ta) return;
    var plain = ideaEdPlainText();
    // 自愈：编辑器为空但真源有内容（如初始化渲染未跟上）→ 用真源重排，别清空真源
    if (plain.trim() === '' && ta.value && ta.value.trim() !== '') {
      ideaRenderIntoEditor();
      return;
    }
    ta.value = plain;
    // 链接闭合（出现 ]]）或行首标记出现时，重排一次让效果就位
    if (/\]\]/.test(ta.value || '') || /(^|\n)[ \t]*\[[rygRYG]\][ \t]?/.test(ta.value || '')) {
      var caret = ideaSaveCaret();
      ideaRenderIntoEditor();
      ideaRestoreCaret(caret);
    }
    ideasTimer = setTimeout(saveIdeas, 300);
  });
  document.getElementById('ideasEditor').addEventListener('blur', function() {
    var ta = document.getElementById('ideasTextarea');
    if (ta) ta.value = ideaEdPlainText();
    ideaRenderIntoEditor();
    saveIdeas();
  });
  document.getElementById('ideasToday').addEventListener('click', ideasGoToday);
  // 右侧日期列表：点击切换（手动），切换前先存档当前页
  document.getElementById('ideasDateList').addEventListener('click', function(e) {
    var item = e.target.closest('.ideas-date-item');
    if (!item) return;
    var date = item.dataset.date;
    if (!date || date === ideasCurrentDate) return;
    ideasSavePage();
    ideasLoadPage(date);
  });

  /* ═══════════════════════════════════════════
   *  思路整理：轻重缓急标记（蜡笔涂抹）+ 悬停说明（实时渲染 + 双击编辑）
   *  ── 不新增任何存储字段，标记与说明都写进 text 正文 ──
   *   行首标记： [r] 红 / [y] 黄 / [g] 绿   （蜡笔涂抹生成，不必手写）
   *   悬停说明： [[显示文字|详细说明]]      （编辑时实时渲染成蓝色链接，双击可改）
   *  相邻同色的行渲染时自动并成一整块，小球只出现在最前面。
   * ═══════════════════════════════════════════ */
  var IDEA_MODE_KEY = 'my_ideas_mode';          // 'edit'（常态） | 'pen'（涂抹中）
  var IDEA_PEN_COLOR_KEY = 'my_ideas_pen_color';
  var ideaMode = 'edit';
  var ideaPenColor = 'r';
  var penPainting = false;
  var penTouched = {};        // {行号: true} 本次涂抹碰到的行
  var penLineEls = {};        // {行号: 元素} 涂抹时实时高亮

  // 行首标记：兼容大小写，标记后可跟 0~N 个空格
  var IDEA_MARK_RE = /^[ \t]*\[([rygRYG])\][ \t]*/;
  // 悬停说明：[[文字|说明]] 或 [[文字]]
  var IDEA_LINK_RE = /\[\[([^\[\]|]+)(?:\|([^\[\]]*))?\]\]/g;
  var IDEA_COLOR_CLASS = { r: 'red', y: 'yellow', g: 'green' };
  var IDEA_PEN_TIP = { r: '红色', y: '黄色', g: '绿色' };

  function ideaParseLine(line) {
    var m = IDEA_MARK_RE.exec(line);
    if (m) return { color: m[1].toLowerCase(), text: line.slice(m[0].length) };
    return { color: '', text: line };
  }

  // 给某一行加/换/去标记（color 传 'e' 即清除）
  function ideaSetLineColor(lines, idx, color) {
    if (idx < 0 || idx >= lines.length) return;
    var body = ideaParseLine(lines[idx]).text;
    if (color === 'e' || color === '') lines[idx] = body;
    else lines[idx] = '[' + color + '] ' + body;
  }

  // 渲染一行正文：转义 + 把 [[..]] 变成可悬停的说明链接
  function ideaRenderText(text) {
    var out = '', last = 0, m;
    IDEA_LINK_RE.lastIndex = 0;
    while ((m = IDEA_LINK_RE.exec(text)) !== null) {
      out += escapeHtml(text.slice(last, m.index));
      var label = m[1];
      var tip = (m[2] !== undefined && m[2] !== '') ? m[2] : label;
      out += '<span class="idea-link" data-tip="' +
             escapeHtml(tip).replace(/"/g, '&quot;') + '">' +
             escapeHtml(label) + '</span>';
      last = m.index + m[0].length;
    }
    out += escapeHtml(text.slice(last));
    return out;
  }

  // 双击链接编辑：在 textarea 全文里定位被点的链接，并弹出编辑框
  function openIdeaEditFromEl(linkEl) {
    if (!linkEl || ideaMode === 'pen') return;
    hideIdeaTip();
    var label = linkEl.textContent;
    var tip = linkEl.getAttribute('data-tip');
    // 在全文里反查这个 [[label|tip]]（或 [[label]]），取最后一个匹配（接近双击的）
    var raw = document.getElementById('ideasTextarea').value || '';
    var pat = new RegExp(
      '\\[\\[' + ideaEscRe(label) + '(?:\\|' + ideaEscRe(tip) + ')?\\]\\]', 'g');
    var m, last = null;
    while ((m = pat.exec(raw)) !== null) last = m;
    var start = last ? last.index : -1;
    var end = last ? last.index + last[0].length : -1;
    ideaEditTarget = (start >= 0) ? { start: start, end: end } : null;
    document.getElementById('ideaLinkLabel').value = label;
    document.getElementById('ideaLinkTip').value = (tip === label) ? '' : tip;
    document.getElementById('ideaLinkModal').classList.add('show');
    setTimeout(function() { document.getElementById('ideaLinkLabel').focus(); }, 40);
  }
  function ideaEscRe(s) {
    return String(s == null ? '' : s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  // ── contenteditable 单区域：显示/输入层 + 隐藏 textarea 真源 ──
  // 视觉上只有一个可编辑区域；真实语法文本存于隐藏 textarea（数据层不变）。
  function ideaEditorEl() { return document.getElementById('ideasEditor'); }

  // contenteditable 的纯文本（保留换行）——输入时的真源同步
  // 按行 DOM 遍历：链接 span 用 data-raw 还原语法，行间加 \n，不依赖换行正则
  function ideaEdPlainText() {
    var ed = ideaEditorEl();
    if (!ed) return '';
    var out = [];
    var lineEls = ed.querySelectorAll('.idea-line');
    for (var i = 0; i < lineEls.length; i++) {
      out.push(ideaLineText(lineEls[i]));
    }
    // 兜底：编辑器里还没有 .idea-line（用户刚输入未重排），按 innerText 取
    if (out.length === 0) return (ed.innerText || '').replace(/^\n+|\n+$/g, '');
    return out.join('\n');
  }
  // 取单行文本：链接 span 用 data-raw 还原语法，行首标记用 data-prefix 恢复，其余取纯文本
  function ideaLineText(lineEl) {
    var tmp = document.createElement('div');
    tmp.appendChild(lineEl.cloneNode(true));
    var links = tmp.querySelectorAll('.idea-link');
    for (var i = links.length - 1; i >= 0; i--) {
      var raw = links[i].getAttribute('data-raw');
      var frag = document.createRange().createContextualFragment(raw);
      links[i].parentNode.replaceChild(frag, links[i]);
    }
    var prefix = lineEl.getAttribute && lineEl.getAttribute('data-prefix');
    return (prefix || '') + (tmp.textContent || '');
  }

  // 把隐藏 textarea 的语法文本渲染进 contenteditable（行首标记→色块，[[..]]→链接）
  function ideaRenderIntoEditor() {
    var ed = ideaEditorEl();
    var ta = document.getElementById('ideasTextarea');
    if (!ed || !ta) return;
    ed.innerHTML = ideaBuildEditableHtml(ta.value || '');
    // 重建涂抹用的行索引（data-line），供 ideaPenTouch/ideaPenHit 使用
    penLineEls = {};
    var lines = ed.querySelectorAll('.idea-line');
    for (var i = 0; i < lines.length; i++) {
      lines[i].setAttribute('data-line', i);
      penLineEls[i] = lines[i];
    }
  }

  // 光标位置：以「字符偏移」保存/恢复（基于纯文本）
  function ideaSaveCaret() {
    var ed = ideaEditorEl();
    if (!ed) return -1;
    var sel = window.getSelection && window.getSelection();
    if (!sel || sel.rangeCount === 0) return -1;
    var range = sel.getRangeAt(0);
    // 简化：用内联文本节点相对偏移近似（只支持单行内偏移）
    var node = range.startContainer;
    var offset = range.startOffset;
    if (node.nodeType === 3) {
      // 找到该文本节点在 editor 内的字符位置
      var pre = document.createRange();
      pre.selectNodeContents(ed);
      pre.setEnd(node, offset);
      return pre.toString().length;
    }
    return -1;
  }
  function ideaRestoreCaret(pos) {
    var ed = ideaEditorEl();
    if (!ed || pos < 0) return;
    try {
      var node = ed.firstChild;
      var range = document.createRange();
      var sel = window.getSelection();
      // 简单恢复：从头数 pos 个字符
      var walker = document.createTreeWalker(ed, NodeFilter.SHOW_TEXT, null, false);
      var acc = 0, target = null;
      while (walker.nextNode()) {
        var len = walker.currentNode.nodeValue.length;
        if (acc + len >= pos) { target = walker.currentNode; break; }
        acc += len;
      }
      if (target) {
        range.setStart(target, pos - acc);
        range.collapse(true);
        sel.removeAllRanges();
        sel.addRange(range);
      }
    } catch(e) {}
  }

  function ideaBuildEditableHtml(raw) {
    var lines = String(raw || '').split('\n');
    var html = '';
    var openBlock = null;
    for (var i = 0; i < lines.length; i++) {
      var p = ideaParseLine(lines[i]);
      var bodyHtml = ideaRenderTextEditable(p.text);
      // 行首标记原文（[r]/[y]/[g]）存到 data-prefix，供还原时恢复
      var prefix = p.color ? ('[' + p.color + '] ') : '';
      var prefixAttr = prefix ? (' data-prefix="' + escapeHtml(prefix) + '"') : '';
      if (p.color) {
        if (openBlock && openBlock === p.color) {
          // 同色续块
          html += '<div class="idea-line" data-block="' + p.color + '"' + prefixAttr + '>' + bodyHtml + '</div>';
        } else {
          // 新块
          html += '<div class="idea-block idea-' + IDEA_COLOR_CLASS[p.color] +
                  '" data-block="' + p.color + '">' +
                  '<span class="idea-ball"></span>' +
                  '<div class="idea-line" data-block="' + p.color + '"' + prefixAttr + '>' + bodyHtml + '</div>' +
                  '</div>';
          openBlock = p.color;
        }
      } else {
        openBlock = null;
        // 空行用 <br> 填充，保证 contenteditable 里可见且可聚焦
        html += '<div class="idea-line"' + prefixAttr + '>' + (bodyHtml === '' ? '<br>' : bodyHtml) + '</div>';
      }
    }
    return html;
  }

  // 渲染一行（可编辑版）：[[..]] → 链接 span（data-raw 存原文语法），其余转义
  function ideaRenderTextEditable(text) {
    var out = '', last = 0, m;
    IDEA_LINK_RE.lastIndex = 0;
    while ((m = IDEA_LINK_RE.exec(text)) !== null) {
      out += escapeHtml(text.slice(last, m.index));
      var label = m[1];
      var tip = (m[2] !== undefined && m[2] !== '') ? m[2] : label;
      out += '<span class="idea-link" contenteditable="false" data-raw="' +
             escapeHtml(m[0]).replace(/"/g, '&quot;') + '" data-tip="' +
             escapeHtml(tip).replace(/"/g, '&quot;') + '">' +
             escapeHtml(label) + '</span>';
      last = m.index + m[0].length;
    }
    out += escapeHtml(text.slice(last));
    return out;
  }

  // 把真源渲染进 contenteditable（单区域），并重建涂抹用的行索引
  function ideasRenderPreview() {
    var ta = document.getElementById('ideasTextarea');
    if (!ta) return;
    ideaRenderIntoEditor();
    penLineEls = {};
    var ed = ideaEditorEl();
    if (!ed) return;
    var lines = ed.querySelectorAll('.idea-line');
    for (var i = 0; i < lines.length; i++) {
      lines[i].setAttribute('data-line', i);
      penLineEls[i] = lines[i];
    }
    var hint = document.getElementById('ideasHint');
    if (hint) {
      if (ideaMode === 'pen') {
        if (!ideaPenColor) hint.textContent = '选一支笔再涂抹';
        else if (penPainting) hint.textContent = '松手生效';
        else if (ideaPenColor === 'e') hint.textContent = '橡皮擦除 · 再点蜡笔退出';
        else hint.textContent = '涂' + (IDEA_PEN_TIP[ideaPenColor] || '') + '标记 · 再点蜡笔退出';
      } else {
        hint.textContent = '🖍 蜡笔涂抹 ｜ 🔗 插说明 ｜ 双击链接改内容';
      }
    }
  }

  // ── 蜡笔：选色后保持涂抹态（可连续涂多行），再点蜡笔按钮退出 ──
  function ideasEnterPen() {
    ideaMode = 'pen';
    var ed = ideaEditorEl();
    if (ed) ed.classList.add('pen-mode');
    try { localStorage.setItem(IDEA_MODE_KEY, 'pen'); } catch(e) {}
    hideIdeaTip();
    ideasRenderPreview();
  }
  function ideasExitPen() {
    if (penPainting) { penPainting = false; penTouched = {}; }
    ideaMode = 'edit';
    var ed = ideaEditorEl();
    if (ed) ed.classList.remove('pen-mode');
    try { localStorage.setItem(IDEA_MODE_KEY, 'edit'); } catch(e) {}
    try { ideasSavePage(); ideasLoadPage(ideasCurrentDate); } catch(e) {}
  }

  function ideaPenTouch(idx) {
    if (typeof idx !== 'number' || isNaN(idx) || idx < 0) return;
    if (penTouched[idx]) return;
    penTouched[idx] = true;
    var el = penLineEls[idx];
    if (el) el.classList.add('pen-hit');
  }

  // 涂抹命中：涂到某一行就标记该行；点在块的小球/色条上则整块一起换色
  function ideaPenHit(e) {
    var el = e.target;
    var lineEl = el.closest ? el.closest('.idea-line') : null;
    if (lineEl) {
      ideaPenTouch(parseInt(lineEl.dataset.line, 10));
      return;
    }
    var blockEl = el.closest ? el.closest('.idea-block') : null;
    if (blockEl) {
      blockEl.querySelectorAll('.idea-line').forEach(function(l) {
        ideaPenTouch(parseInt(l.dataset.line, 10));
      });
    }
  }

  function ideaPenCommit() {
    var touched = Object.keys(penTouched);
    if (touched.length === 0) return;
    var ta = document.getElementById('ideasTextarea');
    var lines = (ta.value || '').split('\n');
    touched.forEach(function(k) {
      ideaSetLineColor(lines, parseInt(k, 10), ideaPenColor);
    });
    ta.value = lines.join('\n');
    penTouched = {};
    ideasSavePage();          // 落盘
    ideaRenderIntoEditor();   // 重排单区域（涂抹结果就位），保持涂抹态可连续涂
  }

  // ── 蜡笔按钮：开关涂抹态 + 弹出选色面板 ──
  document.getElementById('ideasCrayonBtn').addEventListener('click', function(e) {
    e.stopPropagation();
    var pop = document.getElementById('ideasPenGroup');
    if (ideaMode === 'pen') {
      // 已在涂抹态：点蜡笔按钮 = 退出涂抹
      pop.classList.remove('open');
      ideasExitPen();
      return;
    }
    pop.classList.toggle('open');
  });
  // 点面板外关闭
  document.addEventListener('click', function(e) {
    var pop = document.getElementById('ideasPenGroup');
    if (pop.classList.contains('open') &&
        !e.target.closest('#ideasPenToggleWrap')) {
      pop.classList.remove('open');
    }
  });
  document.getElementById('ideasPenGroup').addEventListener('click', function(e) {
    var btn = e.target.closest('.ideas-pen');
    if (!btn) return;
    var c = btn.dataset.color || '';
    if (!c) return;
    ideaPenColor = c;
    try { localStorage.setItem(IDEA_PEN_COLOR_KEY, ideaPenColor); } catch(e) {}
    // 选色即收起面板并进入涂抹态（已处于涂抹态则直接换色继续涂）
    document.getElementById('ideasPenGroup').classList.remove('open');
    if (ideaMode !== 'pen') ideasEnterPen();
    ideasRenderPreview();
  });

  var previewEl = document.getElementById('ideasEditor');
  // 双击链接：弹出编辑框（定位原文位置替换）
  previewEl.addEventListener('dblclick', function(e) {
    var link = e.target.closest ? e.target.closest('.idea-link') : null;
    if (!link) return;
    e.preventDefault();
    openIdeaEditFromEl(link);
  });
  previewEl.addEventListener('mousedown', function(e) {
    if (ideaMode !== 'pen' || ideaPenColor === '' || e.button !== 0) return;
    e.preventDefault();
    penPainting = true;
    penTouched = {};
    ideaPenHit(e);
  });
  previewEl.addEventListener('mousemove', function(e) {
    if (!penPainting) return;
    e.preventDefault();
    ideaPenHit(e);
  });
  document.addEventListener('mouseup', function() {
    if (!penPainting) return;
    penPainting = false;
    ideaPenCommit();
  });
  // 触摸屏：涂抹退化为“点一下整行”
  previewEl.addEventListener('click', function(e) {
    if (ideaMode !== 'pen' || ideaPenColor === '' || penPainting) return;
    if (!e.target.closest || !e.target.closest('.idea-line')) return;
    ideaPenHit(e);
    ideaPenCommit();
  });

  // ── 悬停说明（tooltip） ──
  function showIdeaTip(el) {
    var box = document.getElementById('ideaTip');
    if (!box) return;
    var tip = el.getAttribute('data-tip');
    if (!tip) return;
    box.textContent = tip;
    box.style.display = 'block';
    var r = el.getBoundingClientRect();
    var bw = box.offsetWidth, bh = box.offsetHeight;
    var left = Math.min(Math.max(6, r.left), Math.max(6, window.innerWidth - bw - 6));
    var top = r.bottom + 6;
    if (top + bh > window.innerHeight - 6) top = Math.max(6, r.top - bh - 6);
    box.style.left = left + 'px';
    box.style.top = top + 'px';
  }
  function hideIdeaTip() {
    var box = document.getElementById('ideaTip');
    if (box) box.style.display = 'none';
  }
  previewEl.addEventListener('mouseover', function(e) {
    var link = e.target.closest ? e.target.closest('.idea-link') : null;
    if (link && !penPainting) showIdeaTip(link);
  });
  previewEl.addEventListener('mouseout', function(e) {
    if (e.target.closest && e.target.closest('.idea-link')) hideIdeaTip();
  });
  // 触摸端没有 hover：点一下链接同样弹出说明
  previewEl.addEventListener('click', function(e) {
    var link = e.target.closest ? e.target.closest('.idea-link') : null;
    if (link && ideaMode !== 'pen') {
      if (document.getElementById('ideaTip').style.display === 'block') hideIdeaTip();
      else showIdeaTip(link);
    }
  });
  previewEl.addEventListener('scroll', hideIdeaTip);
  document.getElementById('ideasDrawer').addEventListener('scroll', hideIdeaTip);

  // ── 「🔗 说明」：插入悬停说明（或替换被双击编辑的旧链接） ──
  // 光标位置基于 contenteditable 的纯文本偏移；真源始终是隐藏 textarea
  function ideaEdCaretPos() {
    var sel = window.getSelection && window.getSelection();
    if (!sel || sel.rangeCount === 0) return -1;
    var range = sel.getRangeAt(0);
    var ed = ideaEditorEl();
    if (!ed || !ed.contains(range.startContainer)) return -1;
    var pre = document.createRange();
    pre.selectNodeContents(ed);
    pre.setEnd(range.startContainer, range.startOffset);
    return pre.toString().length;
  }
  function ideaInsertLink(label, tip) {
    if (ideaMode !== 'edit') { ideasExitPen(); }
    var ta = document.getElementById('ideasTextarea');
    var snippet = tip ? ('[[' + label + '|' + tip + ']]') : ('[[' + label + ']]');
    var val = ta.value || '';
    var start, end, caret;
    if (ideaEditTarget && ideaEditTarget.start >= 0 &&
        ideaEditTarget.end >= ideaEditTarget.start &&
        ideaEditTarget.end <= val.length) {
      // 替换被双击编辑的旧链接
      start = ideaEditTarget.start; end = ideaEditTarget.end;
      caret = start + snippet.length;
    } else {
      // 普通插入：插到 contenteditable 光标处的纯文本偏移
      var cp = ideaEdCaretPos();
      start = (cp >= 0) ? cp : val.length;
      end = start;
      caret = start + snippet.length;
    }
    ta.value = val.slice(0, start) + snippet + val.slice(end);
    ideaEditTarget = null;   // 用完即清
    ideasSavePage();
    ideaRenderIntoEditor();
    // 光标放到插入后位置
    ideaRestoreCaret(caret);
    ideaEditorEl().focus();
  }

  function openIdeaLinkModal() {
    hideIdeaTip();
    ideaEditTarget = null;   // 手动插说明不涉及替换旧链接
    var sel = '';
    try {
      var ta = document.getElementById('ideasTextarea');
      if (ta.selectionStart !== ta.selectionEnd) {
        sel = (ta.value || '').slice(ta.selectionStart, ta.selectionEnd).replace(/[\r\n]/g, ' ').trim();
      }
    } catch(e) {}
    document.getElementById('ideaLinkLabel').value = sel;
    document.getElementById('ideaLinkTip').value = '';
    document.getElementById('ideaLinkModal').classList.add('show');
    setTimeout(function() {
      var t = sel ? document.getElementById('ideaLinkTip') : document.getElementById('ideaLinkLabel');
      t.focus();
    }, 40);
  }
  function closeIdeaLinkModal() {
    document.getElementById('ideaLinkModal').classList.remove('show');
  }
  document.getElementById('ideasLinkBtn').addEventListener('click', openIdeaLinkModal);
  document.getElementById('ideaLinkCancel').addEventListener('click', closeIdeaLinkModal);
  document.getElementById('ideaLinkOk').addEventListener('click', function() {
    var label = document.getElementById('ideaLinkLabel').value.trim();
    var tip = document.getElementById('ideaLinkTip').value.trim();
    if (!label) { alert('请填写要显示的文字'); return; }
    closeIdeaLinkModal();
    ideaInsertLink(label, tip);
  });
  document.getElementById('ideaLinkModal').addEventListener('click', function(e) {
    if (e.target === this) closeIdeaLinkModal();   // 点遮罩关闭
  });

  // 恢复上次的笔色；模式固定为编辑（预览始终可见）
  safeCall(function() {
    try {
      var c = localStorage.getItem(IDEA_PEN_COLOR_KEY);
      if (c === 'r' || c === 'y' || c === 'g') ideaPenColor = c;
      var m = localStorage.getItem(IDEA_MODE_KEY);
      if (m === 'pen') { /* 上次在涂抹态，这次仍从编辑态开始，避免误涂 */ }
      localStorage.setItem(IDEA_MODE_KEY, 'edit');
    } catch(e) {}
    ideaMode = 'edit';

  function getWeekStartDate(weekNum) {
    if (!scheduleData || !scheduleData.semesterStart) return new Date();
    var base = new Date(scheduleData.semesterStart + 'T00:00:00');
    base.setDate(base.getDate() + (weekNum - 1) * 7);
    return base;
  }

  function getCurrentWeek() {
    if (!scheduleData || !scheduleData.semesterStart) return 1;
    var today = new Date(todayStr() + 'T00:00:00');
    var base = new Date(scheduleData.semesterStart + 'T00:00:00');
    var diff = today - base;
    var week = Math.floor(diff / (7 * 86400000)) + 1;
    if (week < 1) week = 1;
    return week;
  }

  function formatDateMD(dateStr) {
    var parts = dateStr.split('-');
    return parseInt(parts[1], 10) + '/' + parseInt(parts[2], 10);
  }

  function getWeekDates(weekNum) {
    var start = getWeekStartDate(weekNum);

      var d = new Date(start);
      d.setDate(d.getDate() + i);
      dates.push(localDateStr(d));
    }
    return dates;
  }

  // 文件导入课表（JSON 或 XLS）
  function parseCourseCell(cellText) {
    var courses = [];
    if (!cellText) return courses;
    // 按课程名[ 分割多个课程
    var parts = cellText.split(/(?:\n|(?=\S+\[))/);
    var current = '';
    parts.forEach(function(part) {
      part = part.trim();
      if (!part) return;
      if (/\[[^\]]+\]/.test(part) && /\d+.*周/.test(part)) {
        if (current) { var c = parseOneCourse(current); if (c) courses.push(c); }
        current = part;
      } else {
        current += (current ? ' ' : '') + part;
      }
    });
    if (current) { var c2 = parseOneCourse(current); if (c2) courses.push(c2); }
    return courses;
  }
  function parseOneCourse(text) {
    text = text.replace(/\s+/g, ' ').trim();
    if (!text) return null;
    var m = text.match(/(.+?)\[([^\]]+)\]\s*(\d+)(?:-(\d+))?\s*周\s*(?:[;；]\s*(.+))?$/);
    if (!m) m = text.match(/(.+?)\[([^\]]+)\]\s*(\d+)\s*周\s*(.*)$/);
    if (m) {
      return {
        startWeek: parseInt(m[3], 10),
        endWeek: (m[4] && /^\d+$/.test(m[4])) ? parseInt(m[4], 10) : parseInt(m[3], 10),
        name: m[1].trim(), teacher: m[2].trim(),
        location: (m[5] || '').replace(/^[;；]\s*/, '').trim()
      };
    }
    return null;
  }

  // 从JSON二维数组解析课程
  function parseScheduleJSON(rows) {
    var courses = [];
    if (!Array.isArray(rows) || rows.length < 4) return courses;
    // 找表头行（含"星期"）
    var headerRow = -1;
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      if (Array.isArray(r) && r.some(function(cell) { return /星期/.test(String(cell)); })) {
        headerRow = i; break;
      }
    }
    if (headerRow < 0) headerRow = 2;
    var timeSlotCount = Math.min(rows.length - headerRow - 1, 6);
    for (var r2 = headerRow + 1; r2 < headerRow + 1 + timeSlotCount && r2 < rows.length; r2++) {
      var cells = rows[r2] || [];
      var slotIdx = r2 - headerRow - 1;
      for (var c = 1; c <= 7 && c < cells.length; c++) {
        var txt = String(cells[c] || '').trim();
        if (!txt) continue;
        var parsed = parseCourseCell(txt);
        parsed.forEach(function(cr) {
          courses.push({ day: c, slot: slotIdx, startWeek: cr.startWeek, endWeek: cr.endWeek, name: cr.name, teacher: cr.teacher, location: cr.location });
        });
      }
    }
    return courses;
  }

  function importFromJSONFile(file) {
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var json = JSON.parse(e.target.result);
        var rows = Array.isArray(json) ? json : (json.rows || json.data || []);
        var courses = parseScheduleJSON(rows);
        if (courses.length > 0) {
          scheduleData.courses = courses;
          saveScheduleData();
          currentScheduleWeek = getCurrentWeek();
          renderScheduleTable(currentScheduleWeek);
          alert('导入成功！共解析 ' + courses.length + ' 门课程。');
        } else {
          alert('未能从文件中解析到课程。请确保JSON是课表二维数组格式。');
        }
      } catch(err) {
        alert('JSON解析失败：' + err.message);
      }
    };
    reader.readAsText(file, 'UTF-8');
  }

  function importFromXLSFile(file) {
    if (typeof XLSX === 'undefined') {
      // SheetJS 未加载（离线），回退到脚本方案
      alert('SheetJS 库未加载（可能离线）。\n\n请使用同目录下的 convert_xls.py 脚本转换：\n1. 命令行运行：python convert_xls.py "课表打印.xls"\n2. 生成 课表数据.json\n3. 再点击导入，选择 .json 文件\n\n或者联网刷新页面后直接导入 .xls/.xlsx。');
      return;
    }
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var data = new Uint8Array(e.target.result);
        var wb = XLSX.read(data, { type: 'array' });
        var ws = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
        var courses = parseScheduleJSON(rows);
        if (courses.length > 0) {
          scheduleData.courses = courses;
          saveScheduleData();
          currentScheduleWeek = getCurrentWeek();
          renderScheduleTable(currentScheduleWeek);
          alert('导入成功！共解析 ' + courses.length + ' 门课程。');
        } else {
          alert('未能从文件中解析到课程。请确保是课表表格文件。');
        }
      } catch(err) {
        alert('课表文件解析失败：' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  document.getElementById('schedImportBtn').addEventListener('click', function() {
    document.getElementById('schedFileInput').click();
  });
  document.getElementById('schedFileInput').addEventListener('change', function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var name = file.name.toLowerCase();
    if (name.endsWith('.json')) {
      importFromJSONFile(file);
    } else if (name.endsWith('.xls') || name.endsWith('.xlsx')) {
      importFromXLSFile(file);
    } else {
      alert('请选择 .json（推荐）、.xls 或 .xlsx 文件');
    }
    e.target.value = '';
  });

  /* ═══════════════════════════════════════════
   *  托盘球同步（可选功能）
   *  ── 数据推送到本机 127.0.0.1:8899，供桌面托盘球读取展示
   *  ── 托盘球未运行时静默失败，不影响页面正常使用
   *  ═══════════════════════════════════════════ */
  var TRAY_SYNC_URL = 'http://127.0.0.1:8899/api/sync';
  var TRAY_FULL_URL = 'http://127.0.0.1:8899/api/full';
  var traySyncTimer = null;
  var trayLastPayload = '';
  var trayPullBusy = false;

  // 收集所有需要同步的 localStorage 数据
  function collectTrayPayload() {
    var keys = [TODO_KEY, DATE_KEY, PLAN_KEY, TODAY_KEY, MODE_KEY, PLAN_MODE_KEY,
                WORKLOG_KEY, TOMORROW_KEY, TOMORROW_DISMISS, SCHEDULE_KEY, IDEAS_KEY, DELETED_KEY];
    var payload = {};
    keys.forEach(function(k) {
      try {
        var v = localStorage.getItem(k);
        if (v !== null && v !== undefined) payload[k] = v;
      } catch(e) {}
    });
    return payload;
  }

  // ── JSON 容错 / 合并工具 ──
  function parseJsonArray(raw) {
    try {
      var v = JSON.parse(raw || '[]');
      return Array.isArray(v) ? v : [];
    } catch(e) { return []; }
  }

  function parseJsonObject(raw) {
    try {
      var v = JSON.parse(raw || '{}');
      return (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};
    } catch(e) { return {}; }
  }

  // 稳定序列化：仅用于比较（普通 JSON.stringify 的键顺序不稳定）
  function stableStringify(v) {
    if (v === null || typeof v !== 'object') return JSON.stringify(v);
    if (Array.isArray(v)) return '[' + v.map(stableStringify).join(',') + ']';
    return '{' + Object.keys(v).sort().map(function(k) {
      return JSON.stringify(k) + ':' + stableStringify(v[k]);
    }).join(',') + '}';
  }

  // 合并墓碑 {任务id: 删除时间戳}，同 id 取较新
  function mergeDeletedMaps(a, b) {
    var out = {};
    Object.keys(a || {}).forEach(function(k) { out[k] = Number(a[k]) || 0; });
    Object.keys(b || {}).forEach(function(k) {
      var t = Number(b[k]) || 0;
      if (!(k in out) || t > out[k]) out[k] = t;
    });
    return out;
  }

  // 合并任务列表：按 id + updatedAt 裁决；本地缺失的任务追加进来
  function mergeRemoteTodos(local, remote) {
    var byId = {}, order = [];
    (local || []).forEach(function(t) {
      if (t && t.id) { byId[t.id] = t; order.push(t.id); }
    });
    (remote || []).forEach(function(t) {
      if (!t || !t.id) return;
      var old = byId[t.id];
      if (!old) {
        byId[t.id] = t;
        order.push(t.id);
        return;
      }
      var ru = Number(t.updatedAt) || 0;
      var lu = Number(old.updatedAt) || 0;
      if (ru > lu) byId[t.id] = t;   // 时间相同保留本地
    });
    return order.map(function(id) { return byId[id]; });
  }

  // 合并服务端思路（按日期 ts，较新者胜），返回是否有变化
  function mergeRemoteIdeas(raw) {
    var remote = parseJsonObject(raw);
    var local = parseJsonObject(localStorage.getItem(IDEAS_KEY));
    var changed = false;
    Object.keys(remote).forEach(function(date) {
      var rv = remote[date], lv = local[date];
      if (!lv || ((rv && rv.ts) || 0) > ((lv && lv.ts) || 0)) {
        local[date] = rv;
        changed = true;
      }
    });
    if (changed) localStorage.setItem(IDEAS_KEY, JSON.stringify(local));
    return changed;
  }

  // 已删除任务从各日期的“今日”映射中清理掉
  function cleanupTodayDeleted(delMap) {
    var changed = false;
    Object.keys(todayData).forEach(function(date) {
      var arr = todayData[date];
      if (!Array.isArray(arr)) return;
      var filtered = arr.filter(function(id) { return !(id in delMap); });
      if (filtered.length !== arr.length) {
        changed = true;
        if (filtered.length) todayData[date] = filtered;
        else delete todayData[date];
      }
    });
    if (changed) saveTodayData();
  }

  function isTodoEditing() {
    var el = document.activeElement;
    return !!(el && todoList && todoList.contains(el) &&
              /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
  }

  function isIdeasEditing() {
    var el = document.activeElement;
    if (el && el.id === 'ideasTextarea') return true;
    // 标记模式下编辑框是隐藏的、永远拿不到焦点，涂抹过程中若被拉取刷新会丢笔画；
    // 因此把「正在涂抹」以及「停留在标记模式」也视为编辑中，跳过思路刷新。
    if (penPainting) return true;
    if (ideaMode === 'pen') return true;
    return false;
  }

  function pullFromTray() {
    // 一次拉全量：任务（含手机新增）、删除墓碑、思路、seq
    // 正在编辑任务详情时不拉取，避免打断输入
    if (isTodoEditing() || trayPullBusy) return;
    trayPullBusy = true;
    try {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', TRAY_FULL_URL, true);
      xhr.timeout = 4000;
      xhr.onload = function() {
        trayPullBusy = false;
        if (xhr.status !== 200) return;
        try {
          var d = JSON.parse(xhr.responseText);
          var rd = (d && d.data) || null;
          if (!rd) return;

          var oldDel = parseJsonObject(localStorage.getItem(DELETED_KEY));
          var delMap = mergeDeletedMaps(oldDel, parseJsonObject(rd.my_deleted));
          var merged = mergeRemoteTodos(todos, parseJsonArray(rd.my_todo_list_v2));
          var kept = merged.filter(function(t) {
            return !(t && t.id in delMap);   // 墓碑终局：删除不复活
          });

          var todosChanged = stableStringify(kept) !== stableStringify(todos);
          var delChanged = stableStringify(delMap) !== stableStringify(oldDel);

          if (delChanged) {
            localStorage.setItem(DELETED_KEY, JSON.stringify(delMap));
          }
          if (todosChanged) {
            todos = kept;
            saveTodos();
            safeCall(renderTodos, 'pull-renderTodos');
            safeCall(updateSummary, 'pull-updateSummary');
            safeCall(updateGlobal, 'pull-updateGlobal');
          }
          if (todosChanged || delChanged) cleanupTodayDeleted(delMap);

          var ideasChanged = mergeRemoteIdeas(rd.my_ideas);
          if (ideasChanged && !isIdeasEditing()) {
            safeCall(function() { ideasLoadPage(ideasCurrentDate); }, 'pull-ideas');
          }
          // 本地有变化就强制回推一次，让服务端收敛
          if (todosChanged || delChanged || ideasChanged) trayLastPayload = '';
        } catch(e) {}
      };
      xhr.onerror = function() { trayPullBusy = false; };
      xhr.ontimeout = function() { trayPullBusy = false; };
      xhr.send();
    } catch(e) {
      trayPullBusy = false;
    }
  }

  function syncToTray() {
    try {
      var payload = collectTrayPayload();
      var text = JSON.stringify(payload);
      if (text === trayLastPayload) return; // 内容无变化，不重复发送
      var xhr = new XMLHttpRequest();
      xhr.open('POST', TRAY_SYNC_URL, true);
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.onload = function() {
        if (xhr.status === 200) trayLastPayload = text;
      };
      xhr.onerror = function() { /* 托盘球未运行，静默 */ };
      xhr.send(text);
    } catch(e) { /* 静默 */ }
  }

  function startTraySync() {
    // 页面打开先同步一次，之后每 8 秒拉取 + 推送
    setTimeout(syncToTray, 1200);
    traySyncTimer = setInterval(function() {
      pullFromTray();
      syncToTray();
    }, 8000);
    // 页面重新可见时立即同步
    document.addEventListener('visibilitychange', function() {
      if (!document.hidden) {
        pullFromTray();
        syncToTray();
      }
    });
  }

  /* ═══════════════════════════════════════════
   *  启动（每一步独立 try-catch，确保单模块异常不影响其他模块）
   * ═══════════════════════════════════════════ */
  function safeCall(fn, label) {
    try { fn(); } catch(e) { console.error('Startup error [' + label + ']:', e); }
  }
  safeCall(loadTodos, 'loadTodos');
  safeCall(migrateTodoIds, 'migrateTodoIds');
  safeCall(loadTodayData, 'loadTodayData');
  safeCall(loadTodayMode, 'loadTodayMode');
  safeCall(loadDates, 'loadDates');
  safeCall(loadPlans, 'loadPlans');
  safeCall(loadPanelMode, 'loadPanelMode');
  safeCall(loadScheduleData, 'loadScheduleData');
  safeCall(loadScheduleMode, 'loadScheduleMode');
  safeCall(updateScheduleModeUI, 'updateScheduleModeUI');
  safeCall(loadWorklog, 'loadWorklog');
  safeCall(loadTomorrow, 'loadTomorrow');
  safeCall(loadIdeas, 'loadIdeas');
  safeCall(startTraySync, 'startTraySync');
  worklogActive = todayStr();
  safeCall(function() { document.getElementById('dateInput').value = todayStr(); }, 'setDateInput');
  safeCall(updateModeUI, 'updateModeUI');
  safeCall(updatePanelUI, 'updatePanelUI');
  safeCall(renderTodos, 'renderTodos');
  safeCall(renderDates, 'renderDates');
  safeCall(renderWorklogTabs, 'renderWorklogTabs');
  safeCall(renderWorklogContent, 'renderWorklogContent');
  safeCall(renderTomorrow, 'renderTomorrow');
  // 初始化迷你日历
  var now = new Date();
  calState.year = now.getFullYear();
  calState.month = now.getMonth() + 1;
  if (isPlanMode) safeCall(renderMiniCalendar, 'renderMiniCalendar');
  // 模式切换按钮
  safeCall(function() { document.getElementById('modeToggle').addEventListener('click', toggleMode); }, 'bindModeToggle');
  // 延迟弹出，让页面先渲染完
  safeCall(function() { setTimeout(checkTomorrowModal, 300); }, 'scheduleModal');
  // 检测备份数据
  safeCall(function() {
    var backupKeys = [TODO_KEY, DATE_KEY, PLAN_KEY, WORKLOG_KEY];
    var found = [];
    backupKeys.forEach(function(k) {
      var backups = getBackups(k);
      if (backups.length > 0) found.push({ key: k, count: backups.length, backups: backups });
    });
    if (found.length === 0) return;
    // 显示恢复横幅
    var banner = document.getElementById('restoreBanner');
    var textEl = document.getElementById('restoreBannerText');
    var labels = found.map(function(f) {
      var short = f.key.replace('my_', '').replace('_v2', '');
      return short + '(' + f.count + '份)';
    });
    textEl.textContent = '🔧 发现备份数据：' + labels.join(', ') + ' — 可能包含之前丢失的内容';
    banner.style.display = 'flex';

    document.getElementById('restoreBannerBtn').addEventListener('click', function() {
      var restored = 0;
      found.forEach(function(f) {
        if (restoreFromBackup(f.key, 0)) restored++;
      });
      if (restored > 0) {
        alert('已恢复 ' + restored + ' 项数据，页面将刷新。');
        location.reload();
      } else {
        alert('恢复失败，请查看控制台。');
      }
    });

    document.getElementById('restoreBannerDismiss').addEventListener('click', function() {
      banner.style.display = 'none';
    });
  }, 'checkBackups');
  // 导出全部数据
  safeCall(function() {
    document.getElementById('exportAllBtn').addEventListener('click', function() {
      var allData = {};
      [TODO_KEY, DATE_KEY, PLAN_KEY, TODAY_KEY, MODE_KEY, PLAN_MODE_KEY,
       WORKLOG_KEY, TOMORROW_KEY, TOMORROW_DISMISS, SCHEDULE_KEY,
       DELETED_KEY, IDEAS_KEY].forEach(function(k) {
        var v = localStorage.getItem(k);
        if (v !== null && v !== undefined) allData[k] = v;
      });
      var blob = new Blob([JSON.stringify(allData, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'todo_backup_' + todayStr() + '.json';
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('importAllBtn').addEventListener('click', function() {
      document.getElementById('importAllFile').click();
    });

    document.getElementById('importAllFile').addEventListener('change', function(e) {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev) {
        try {
          var data = JSON.parse(ev.target.result);
          if (!data || typeof data !== 'object') { alert('文件格式无效'); return; }
          var keys = Object.keys(data);
          if (keys.length === 0) { alert('文件中没有数据'); return; }
          if (!confirm('将导入 ' + keys.length + ' 个数据项，当前数据会被覆盖。\n\n建议先点击「📤 导出」保存当前数据。\n\n确认导入？')) return;
          var imported = 0;
          keys.forEach(function(k) {
            try {
              saveWithBackup(k, data[k]);
              imported++;
            } catch(e) { console.error('导入失败:', k, e); }
          });
          alert('已导入 ' + imported + ' 项。页面将刷新。');
          location.reload();
        } catch(err) {
          alert('文件解析失败：' + err.message);
        }
      };
      reader.readAsText(file, 'UTF-8');
      e.target.value = '';
    });
  }, 'bindExportImport');

  // 启动诊断：打印所有 localStorage 数据概况
  safeCall(function() {
    console.log('═══ localStorage 数据诊断 ═══');
    var keys = ['my_todo_list_v2','my_date_notes','my_date_plans','my_today_data',
                'my_today_mode','my_panel_mode','my_worklog','my_tomorrow_msg',
                'my_tomorrow_dismiss','my_schedule_data'];
    keys.forEach(function(k) {
      try {
        var raw = localStorage.getItem(k);
        if (!raw) { console.log(k + ': (空)'); return; }
        var v;
        try { v = JSON.parse(raw); } catch(e) { v = raw; }
        if (Array.isArray(v)) {
          console.log(k + ': 数组, ' + v.length + ' 条', v.slice(0, 3));
        } else if (v && typeof v === 'object') {
          console.log(k + ': 对象, keys=' + Object.keys(v).length, v);
        } else {
          console.log(k + ': ' + typeof v, v);
        }
      } catch(e) { console.log(k + ': 读取失败 - ' + e.message); }
    });
    console.log('═══ 诊断完毕 ═══');
  }, 'diagnostics');
  // 自动周一切换检测
  var lastScheduleWeek = getCurrentWeek();
  safeCall(function() {
    setInterval(function() {
      if (scheduleVisible) {
        var w = getCurrentWeek();
        if (w !== lastScheduleWeek) {
          lastScheduleWeek = w;
          currentScheduleWeek = w;
          renderScheduleTable(w);
        }
      }
    }, 60000);
  }, 'scheduleWeekCheck');
})();
</script>
