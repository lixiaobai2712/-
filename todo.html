  function ideasGoToday() {
    ideasSavePage();
    ideasLoadPage(todayStr());
  }

  function loadIdeas() {
    try {
      // 记住手动选中的日期；记录已被清空的旧位置回退到今天
      var pos = null;
      try { pos = localStorage.getItem(IDEAS_POS_KEY); } catch(e) {}
      var store = loadIdeasStore();
      if (!pos || (pos !== todayStr() &&
          !(store[pos] && typeof store[pos].text === 'string' && store[pos].text.trim()))) {
        pos = todayStr();
      }
      ideasLoadPage(pos);
      var open = localStorage.getItem(IDEAS_OPEN_KEY);
      if (open === 'true') {
        document.getElementById('ideasDrawer').classList.add('open');
        document.getElementById('ideasToggle').textContent = '▶';
        document.getElementById('ideasToggle').style.right = IDEAS_DRAWER_W + 'px';
      }
    } catch(e) { console.error('loadIdeas:', e); }
  }

  function saveIdeas() {
    try { ideasSavePage(); } catch(e) {}
  }

  function toggleIdeas() {
    if (penStroke) ideaPenFinish();
    if (ideaView === 'edit') { ideaEnterRenderView(); saveIdeas(); }
    var drawer = document.getElementById('ideasDrawer');
    var toggle = document.getElementById('ideasToggle');
    var open = drawer.classList.toggle('open');
    toggle.textContent = open ? '▶' : '◀';
    toggle.style.right = open ? (IDEAS_DRAWER_W + 'px') : '0';
    try { localStorage.setItem(IDEAS_OPEN_KEY, String(open)); } catch(e) {}
  }

  document.getElementById('ideasToggle').addEventListener('click', toggleIdeas);
  document.getElementById('ideasClose').addEventListener('click', toggleIdeas);
  // 方案A：编辑会话（纯文本）输入时同步真源，无反解、不重排、不打断输入流；
  // 渲染视图（只读 contenteditable=false）不会产生 input，此处兜底忽略
  document.getElementById('ideasEditor').addEventListener('input', function() {
    if (ideaView !== 'edit') return;
    clearTimeout(ideasTimer);
    var ta = document.getElementById('ideasTextarea');
    if (!ta) return;
    ta.value = ideaEdPlainText();
    ideasTimer = setTimeout(saveIdeas, 300);
  });
  // 失焦 = 编辑会话结束：写回真源 → 渲染视图（色块/链接就位）
  document.getElementById('ideasEditor').addEventListener('blur', function() {
    if (ideaView !== 'edit') return;
    var ta = document.getElementById('ideasTextarea');
    if (ta) ta.value = ideaEdPlainText();
    ideaEnterRenderView();
    saveIdeas();
  });
  document.getElementById('ideasToday').addEventListener('click', ideasGoToday);
  // 右侧日期列表：点击切换（手动），切换前先存档当前页
  document.getElementById('ideasDateList').addEventListener('click', function(e) {
    var item = e.target.closest('.ideas-date-item');
    if (!item) return;
    var date = item.dataset.date;
    if (!date || date === ideasCurrentDate) return;
    ideasSavePage();
    ideasLoadPage(date);
  });

  /* ═══════════════════════════════════════════
   *  思路整理：轻重缓急标记（蜡笔涂抹）+ 悬停说明（实时渲染 + 双击编辑）
   *  ── 不新增任何存储字段，标记与说明都写进 text 正文 ──
   *   行首标记： [r] 红 / [y] 黄 / [g] 绿   （蜡笔涂抹生成，不必手写）
   *   悬停说明： [[显示文字|详细说明]]      （编辑时实时渲染成蓝色链接，双击可改）
   *  相邻同色的行渲染时自动并成一整块，小球只出现在最前面。
   * ═══════════════════════════════════════════ */
  var IDEA_MODE_KEY = 'my_ideas_mode';          // 'edit'（常态） | 'pen'（涂抹中）
  var IDEA_PEN_COLOR_KEY = 'my_ideas_pen_color';
  var ideaMode = 'edit';
  var ideaView = 'render';      // 方案A：'edit'=纯文本编辑会话（无反解）；'render'=只读渲染视图（色块/链接/涂抹）
  var ideaPenColor = 'r';
  var penLineEls = {};        // {行号: 元素} 涂抹时实时高亮
  // 一笔只操作按下时的日期、原文和笔色；取消或切页后不允许迟到的事件落盘。
  var penStroke = null;      // {date, raw, color, touched, last, x, y, dragging, pointerId}
  var PEN_CLICK_THRESHOLD = 8; // px：小于等于此位移算单击
  var penJustCommitted = false;

  // 行首标记：兼容大小写，标记后可跟 0~N 个空格
  var IDEA_MARK_RE = /^[ \t]*\[([rygRYG])\][ \t]*/;
  // 悬停说明：[[文字|说明]] 或 [[文字]]
  var IDEA_LINK_RE = /\[\[([^\[\]|]+)(?:\|([^\[\]]*))?\]\]/g;
  var IDEA_COLOR_CLASS = { r: 'red', y: 'yellow', g: 'green' };
  var IDEA_PEN_TIP = { r: '红色', y: '黄色', g: '绿色' };

  function ideaParseLine(line) {
    var m = IDEA_MARK_RE.exec(line);
    if (m) return { color: m[1].toLowerCase(), text: line.slice(m[0].length) };
    return { color: '', text: line };
  }

  // 给某一行加/换/去标记（color 传 'e' 即清除）
  function ideaSetLineColor(lines, idx, color) {
    if (idx < 0 || idx >= lines.length) return;
    if (color !== '' && color !== 'e' && !/^[ryg]$/.test(color)) return;
    var match = IDEA_MARK_RE.exec(lines[idx]);
    // 替换标记时只移除语法分隔符，正文的缩进和空格保持原样。
    var prefix = /^[ \t]*\[[rygRYG]\][ \t]?/;
    var body = match ? lines[idx].replace(prefix, '') : lines[idx];
    if (color === 'e' || color === '') lines[idx] = body;
    else lines[idx] = '[' + color + '] ' + body;
  }

  // 渲染一行正文：转义 + 把 [[..]] 变成可悬停的说明链接
  function ideaRenderText(text) {
    var out = '', last = 0, m;
    IDEA_LINK_RE.lastIndex = 0;
    while ((m = IDEA_LINK_RE.exec(text)) !== null) {
      out += escapeHtml(text.slice(last, m.index));
      var label = m[1];
      var tip = (m[2] !== undefined && m[2] !== '') ? m[2] : label;
      out += '<span class="idea-link" data-tip="' +
             escapeHtml(tip).replace(/"/g, '&quot;') + '">' +
             escapeHtml(label) + '</span>';
      last = m.index + m[0].length;
    }
    out += escapeHtml(text.slice(last));
    return out;
  }

  // 双击链接编辑：在 textarea 全文里定位被点的链接，并弹出编辑框
  function openIdeaEditFromEl(linkEl) {
    if (!linkEl || ideaMode === 'pen') return;
    hideIdeaTip();
    var label = linkEl.textContent;
    var tip = linkEl.getAttribute('data-tip');
    // 在全文里反查这个 [[label|tip]]（或 [[label]]），取最后一个匹配（接近双击的）
    var raw = document.getElementById('ideasTextarea').value || '';
    var pat = new RegExp(
      '\\[\\[' + ideaEscRe(label) + '(?:\\|' + ideaEscRe(tip) + ')?\\]\\]', 'g');
    var m, last = null;
    while ((m = pat.exec(raw)) !== null) last = m;
    var start = last ? last.index : -1;
    var end = last ? last.index + last[0].length : -1;
    ideaEditTarget = (start >= 0) ? { start: start, end: end } : null;
    document.getElementById('ideaLinkLabel').value = label;
    document.getElementById('ideaLinkTip').value = (tip === label) ? '' : tip;
    document.getElementById('ideaLinkModal').classList.add('show');
    setTimeout(function() { document.getElementById('ideaLinkLabel').focus(); }, 40);
  }
  function ideaEscRe(s) {
    return String(s == null ? '' : s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  // ── contenteditable 单区域：显示/输入层 + 隐藏 textarea 真源 ──
  // 视觉上只有一个可编辑区域；真实语法文本存于隐藏 textarea（数据层不变）。
  function ideaEditorEl() { return document.getElementById('ideasEditor'); }

  // 方案A：编辑会话的真源同步——逐行取 textContent（不用 innerText：
  // innerText 会把空行 div 合并掉，round-trip 丢行，这正是方案A要消灭的数据破坏）
  // 渲染视图（只读）不产生输入，兜底直接返回真源，绝不用渲染 DOM 反向污染数据
  function ideaEdPlainText() {
    var ed = ideaEditorEl();
    if (!ed) return '';
    if (ideaView === 'edit') {
      return ideaReadPlainDom(ed);
    }
    var ta = document.getElementById('ideasTextarea');
    return (ta && ta.value) || '';
  }

  // 浏览器可生成根文本、div/p、嵌套换行和 br；逐节点读取，保留空行。
  function ideaReadPlainDom(root) {
    function read(parent) {
      var out = '', previousBlock = false;
      for (var node = parent.firstChild; node; node = node.nextSibling) {
        var block = node.nodeType === 1 && /^(DIV|P)$/.test(node.tagName);
        if (node !== parent.firstChild && (block || previousBlock)) out += '\n';
        if (node.nodeType === 3) out += node.nodeValue;
        else if (node.nodeType === 1) {
          if (node.tagName === 'BR') {
            if (parent.childNodes.length !== 1) out += '\n';
          } else out += read(node);
        }
        previousBlock = block;
      }
      return out;
    }
    return read(root);
  }

  // ── 方案A：编辑会话（纯文本，浏览器原生编辑） ↔ 渲染视图（只读，色块/链接/涂抹） ──
  // 原则：视图是模型的投影。输入只在纯文本会话发生，渲染只发生在会话外，
  // 彻底消除「contenteditable 里塞结构 → 选区/拖拽/删除冲突」这一类 bug。
  function ideaEnterEditView(lineIdx) {
    var ed = ideaEditorEl();
    var ta = document.getElementById('ideasTextarea');
    if (!ed || !ta || ideaView === 'edit') { if (ed) ed.focus(); return; }
    ideaView = 'edit';
    ed.contentEditable = 'true';
    // 渲染结构 → 纯文本（换行保留），浏览器接管后续一切输入
    ed.innerHTML = '';
    var val = ta.value || '';
    if (val !== '') {
      var lines = val.split('\n');
      var html = '';
      for (var i = 0; i < lines.length; i++) {
        // 空行用 <br> 占位：否则 div 无高度、innerText/textContent 都不保留空行（round-trip 丢行）
        html += '<div>' + (lines[i] ? escapeHtml(lines[i]) : '<br>') + '</div>';
      }
      ed.innerHTML = html;
    }
    ed.focus();
    ideaPlaceCaretAtLine(lineIdx);
  }
  function ideaEnterRenderView() {
    var ed = ideaEditorEl();
    if (!ed) return;
    var ta = document.getElementById('ideasTextarea');
    if (ideaView === 'edit' && ta) ta.value = ideaEdPlainText();
    ideaPenCancel();
    ideaView = 'render';
    ed.contentEditable = 'false';
    try { window.getSelection().removeAllRanges(); } catch(e) {}
    ideaRenderIntoEditor();
  }
  // 编辑会话里把光标放到第 lineIdx 行末尾（-1=全文末尾）；行 = 浏览器原生块级 div
  function ideaPlaceCaretAtLine(lineIdx) {
    var ed = ideaEditorEl();
    var sel = window.getSelection();
    if (!ed || !sel) return;
    var blocks = ed.children;
    var target = null;
    if (lineIdx >= 0 && blocks[lineIdx]) target = blocks[lineIdx];
    else if (blocks.length) target = blocks[blocks.length - 1];
    var w = document.createTreeWalker(target || ed, NodeFilter.SHOW_TEXT, null, false);
    var last = null;
    while (w.nextNode()) last = w.currentNode;
    var range = document.createRange();
    if (last) { range.setStart(last, last.nodeValue.length); range.collapse(true); }
    else if (target) { range.selectNodeContents(target); range.collapse(false); }
    else { range.selectNodeContents(ed); range.collapse(false); }
    try { sel.removeAllRanges(); sel.addRange(range); } catch(e) {}
  }
  // 编辑会话里按「纯文本字符偏移」放光标（插入链接后用）
  function ideaRestoreCaret(pos) {
    var ed = ideaEditorEl();
    if (!ed || pos < 0) return;
    try {
      var range = document.createRange();
      var sel = window.getSelection();
      var walker = document.createTreeWalker(ed, NodeFilter.SHOW_TEXT, null, false);
      var acc = 0, target = null;
      while (walker.nextNode()) {
        var len = walker.currentNode.nodeValue.length;
        if (acc + len >= pos) { target = walker.currentNode; break; }
        acc += len;
      }
      if (target) {
        range.setStart(target, pos - acc);
        range.collapse(true);
        sel.removeAllRanges();
        sel.addRange(range);
      }
    } catch(e) {}
  }

  // 把隐藏 textarea 的语法文本渲染进 contenteditable（行首标记→色块，[[..]]→链接）
  function ideaRenderIntoEditor() {
    var ed = ideaEditorEl();
    var ta = document.getElementById('ideasTextarea');
    if (!ed || !ta) return;
    ed.innerHTML = ideaBuildEditableHtml(ta.value || '');
    // 重建涂抹用的行索引（data-line），供 ideaPenTouch/ideaPenHit 使用
    penLineEls = {};
    var lines = ed.querySelectorAll('.idea-line');
    for (var i = 0; i < lines.length; i++) {
      penLineEls[i] = lines[i];
    }
  }

  function ideaBuildEditableHtml(raw) {
    var lines = String(raw || '').split('\n');
    var html = '', openColor = '';
    lines.forEach(function(line, idx) {
      var p = ideaParseLine(line);
      if (openColor && openColor !== p.color) { html += '</div>'; openColor = ''; }
      if (p.color && !openColor) {
        html += '<div class="idea-block idea-' + IDEA_COLOR_CLASS[p.color] + '" data-block="' + p.color + '">' +
                '<span class="idea-ball"></span>';
        openColor = p.color;
      }
      html += '<div class="idea-line" data-line="' + idx + '">' + (ideaRenderTextEditable(p.text) || '<br>') + '</div>';
    });
    return html + (openColor ? '</div>' : '');
  }

  // 渲染一行（可编辑版）：[[..]] → 链接 span（data-raw 存原文语法），其余转义
  function ideaRenderTextEditable(text) {
    var out = '', last = 0, m;
    IDEA_LINK_RE.lastIndex = 0;
    while ((m = IDEA_LINK_RE.exec(text)) !== null) {
      out += escapeHtml(text.slice(last, m.index));
      var label = m[1];
      var tip = (m[2] !== undefined && m[2] !== '') ? m[2] : label;
      out += '<span class="idea-link" contenteditable="false" data-raw="' +
             escapeHtml(m[0]).replace(/"/g, '&quot;') + '" data-tip="' +
             escapeHtml(tip).replace(/"/g, '&quot;') + '">' +
             escapeHtml(label) + '</span>';
      last = m.index + m[0].length;
    }
    out += escapeHtml(text.slice(last));
    return out;
  }

  // 进入只读渲染视图（色块/链接/涂抹都只在这一层发生）并重建涂抹用的行索引
  function ideasRenderPreview() {
    ideaPenCancel();
    var ed = ideaEditorEl();
    var ta = document.getElementById('ideasTextarea');
    if (!ta) return;
    // 若还在编辑会话：先写回真源，再切只读渲染视图（幂等）
    if (ideaView === 'edit' && ed) ta.value = ideaEdPlainText();
    ideaView = 'render';
    if (ed) ed.contentEditable = 'false';
    try { window.getSelection().removeAllRanges(); } catch(e) {}
    ideaRenderIntoEditor();
    penLineEls = {};
    if (!ed) return;
    var lines = ed.querySelectorAll('.idea-line');
    for (var i = 0; i < lines.length; i++) {
      lines[i].setAttribute('data-line', i);
      penLineEls[i] = lines[i];
    }
    var hint = document.getElementById('ideasHint');
    if (hint) {
      if (ideaMode === 'pen') {
        if (!ideaPenColor) hint.textContent = '选一支笔再涂抹';
        else if (penStroke) hint.textContent = '松手生效';
        else if (ideaPenColor === 'e') hint.textContent = '橡皮擦除 · 再点蜡笔退出';
        else hint.textContent = '涂' + (IDEA_PEN_TIP[ideaPenColor] || '') + '标记 · 再点蜡笔退出';
      } else {
        hint.textContent = '🖍 蜡笔涂抹 ｜ 🔗 插说明 ｜ 双击链接改内容';
      }
    }
  }

  // 供自动化测试的只读钩子（等价「从存储加载 → 渲染视图」；正常运行不依赖它）
  window.__ideasApi = {
    render: function() { ideasRenderPreview(); },
    enterEdit: function() { ideaEnterEditView(-1); },
    view: function() { return ideaView; },
    mode: function() { return ideaMode; }
  };

  // ── 蜡笔：选色后保持涂抹态（可连续涂多行），再点蜡笔按钮退出 ──
  function ideasUpdatePenButton() {
    var btn = document.getElementById('ideasCrayonBtn');
    var active = ideaMode === 'pen';
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-pressed', String(active));
    btn.textContent = active ? '🖍 上色中' : '🖍 蜡笔';
    btn.title = active ? '上色模式已开启，点击退出' : '点击进入上色模式';
  }
  function ideasEnterPen() {
    ideaMode = 'pen';
    ideasUpdatePenButton();
    var ed = ideaEditorEl();
    if (ed) ed.classList.add('pen-mode');
    try { localStorage.setItem(IDEA_MODE_KEY, 'pen'); } catch(e) {}
    hideIdeaTip();
    ideasRenderPreview();   // 内含「编辑会话 → 只读渲染视图」的切换
  }
  function ideasExitPen() {
    ideaPenCancel();
    ideaMode = 'edit';
    ideasUpdatePenButton();
    var ed = ideaEditorEl();
    if (ed) ed.classList.remove('pen-mode');
    try { localStorage.setItem(IDEA_MODE_KEY, 'edit'); } catch(e) {}
    try { ideasSavePage(); ideasLoadPage(ideasCurrentDate); } catch(e) {}
  }

  function ideaPenTouch(idx) {
    if (!penStroke || !penLineEls[idx] || penStroke.touched[idx]) return;
    penStroke.touched[idx] = true;
    var el = penLineEls[idx];
    el.classList.remove('pen-live-r', 'pen-live-y', 'pen-live-g', 'pen-live-e');
    el.classList.add('pen-hit', 'pen-live-' + penStroke.color);
  }

  // 只接受编辑器可见区域内的命中；小球/色块边缘优先命中整块。
  function ideaPenHit(e) {
    var ed = ideaEditorEl(), r = ed.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX >= r.right - (ed.offsetWidth - ed.clientWidth) ||
        e.clientY < r.top || e.clientY > r.bottom) return null;
    var target = document.elementFromPoint(e.clientX, e.clientY);
    if (!target || !ed.contains(target)) return null;
    var line = target.closest('.idea-line');
    var block = target.closest('.idea-block');
    if (!line && block) return Array.prototype.map.call(block.querySelectorAll('.idea-line'), function(l) {
      return Number(l.dataset.line);
    });
    // 高 DPI 下 elementFromPoint 会在行边界提前命中下一行；几何范围是行号的依据。
    for (var k in penLineEls) {
      var lr = penLineEls[k].getBoundingClientRect();
      if (e.clientY >= lr.top && e.clientY < lr.bottom) return [Number(k)];
    }
    return line ? [Number(line.dataset.line)] : null;
  }

  function ideaPenMove(e) {
    var hit = ideaPenHit(e);
    if (!hit) { penStroke.last = null; return; }
    var idx = hit[0];
    // 快速移动会跳过 mouse/pointermove 事件，补齐两个命中行之间的路径。
    if (penStroke.last !== null) {
      for (var i = Math.min(penStroke.last, idx); i <= Math.max(penStroke.last, idx); i++) ideaPenTouch(i);
    }
    hit.forEach(ideaPenTouch);
    penStroke.last = hit[hit.length - 1];
  }

  function ideaPenStart(e) {
    if (ideaMode !== 'pen' || penStroke || e.button !== 0 || e.isPrimary === false) return;
    var hit = ideaPenHit(e);
    if (!hit) return;
    e.preventDefault();
    var ed = ideaEditorEl();
    var raw = document.getElementById('ideasTextarea').value;
    penStroke = { date: ideasCurrentDate, raw: raw, color: ideaPenColor,
      touched: {}, last: null, x: e.clientX, y: e.clientY, dragging: false, pointerId: e.pointerId };
    penJustCommitted = false;
    // 预览独立于原色块：换色和擦除都覆盖原颜色，不反解 DOM、不改变布局。
    ed.classList.add('pen-preview');
    raw.split('\n').forEach(function(line, i) {
      var color = ideaParseLine(line).color;
      if (color && penLineEls[i]) penLineEls[i].classList.add('pen-live-' + color);
    });
    hit.forEach(ideaPenTouch);
    penStroke.last = hit[hit.length - 1];
    hideIdeaTip();
  }

  function ideaPenCancel() {
    if (!penStroke) return;
    penStroke = null;
    var ed = ideaEditorEl();
    if (ed) {
      ed.classList.remove('pen-preview');
      ed.querySelectorAll('.idea-line').forEach(function(line) {
        line.classList.remove('pen-hit', 'pen-live-r', 'pen-live-y', 'pen-live-g', 'pen-live-e');
      });
    }
  }

  function ideaPenFinish() {
    if (!penStroke) return;
    var stroke = penStroke;
    var ta = document.getElementById('ideasTextarea');
    ideaPenCancel();
    penJustCommitted = true;
    setTimeout(function() { penJustCommitted = false; }, 0);
    // 页码或正文在这笔期间被替换，丢弃笔画，禁止把旧索引写到新正文。
    if (stroke.date !== ideasCurrentDate || stroke.raw !== ta.value) return;
    var lines = stroke.raw.split('\n');
    Object.keys(stroke.touched).forEach(function(k) {
      ideaSetLineColor(lines, Number(k), stroke.color);
    });
    var next = lines.join('\n');
    if (next === stroke.raw) return;
    var ed = ideaEditorEl(), st = ed.scrollTop;
    ta.value = next;
    ideasSavePage();
    ideaRenderIntoEditor();
    ed.scrollTop = st;
  }

  // ── 蜡笔按钮：开关涂抹态 + 弹出选色面板 ──
  document.getElementById('ideasCrayonBtn').addEventListener('click', function(e) {
    e.stopPropagation();
    var pop = document.getElementById('ideasPenGroup');
    if (ideaMode === 'pen') {
      // 已在涂抹态：点蜡笔按钮 = 退出涂抹
      pop.classList.remove('open');

    pop.classList.add('open');

  // Pointer Events 同时覆盖鼠标、触笔和触摸；笔画生命周期只有一个状态对象。
  previewEl.addEventListener('pointerdown', ideaPenStart);
  document.addEventListener('pointermove', function(e) {
    if (!penStroke || e.pointerId !== penStroke.pointerId) return;
    if (e.buttons === 0) { ideaPenFinish(); return; }
    e.preventDefault();
    var dx = e.clientX - penStroke.x, dy = e.clientY - penStroke.y;
    if (!penStroke.dragging && dx * dx + dy * dy <= PEN_CLICK_THRESHOLD * PEN_CLICK_THRESHOLD) return;
    penStroke.dragging = true;
    ideaPenMove(e);
  }, { passive: false });
  document.addEventListener('pointerup', function(e) {
    if (!penStroke || e.pointerId !== penStroke.pointerId) return;
    if (penStroke.dragging) ideaPenMove(e);
    ideaPenFinish();
  });
  document.addEventListener('pointercancel', function(e) {
    if (penStroke && e.pointerId === penStroke.pointerId) ideaPenCancel();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && penStroke) { e.preventDefault(); ideaPenCancel(); }

  document.addEventListener('mouseleave', ideaPenFinish);

      if (!penStroke && e.detail === 0 && e.target.closest('.idea-line')) {
        var idx = Number(e.target.closest('.idea-line').dataset.line);
        penStroke = { date: ideasCurrentDate, raw: document.getElementById('ideasTextarea').value,
          color: ideaPenColor, touched: {}, last: idx };
        ideaPenTouch(idx);
        ideaPenFinish();

  // ── 悬停说明（tooltip） ──
  function showIdeaTip(el) {
    var box = document.getElementById('ideaTip');
    if (!box) return;
    var tip = el.getAttribute('data-tip');
    if (!tip) return;
    box.textContent = tip;
    box.style.display = 'block';
    var r = el.getBoundingClientRect();
    var bw = box.offsetWidth, bh = box.offsetHeight;
    var left = Math.min(Math.max(6, r.left), Math.max(6, window.innerWidth - bw - 6));
    var top = r.bottom + 6;
    if (top + bh > window.innerHeight - 6) top = Math.max(6, r.top - bh - 6);
    box.style.left = left + 'px';
    box.style.top = top + 'px';
  }
  function hideIdeaTip() {
    var box = document.getElementById('ideaTip');
    if (box) box.style.display = 'none';
  }
  previewEl.addEventListener('mouseover', function(e) {
    var link = e.target.closest ? e.target.closest('.idea-link') : null;
    if (link && !penStroke) showIdeaTip(link);

  previewEl.addEventListener('mouseout', function(e) {

  previewEl.addEventListener('click', function(e) {

  // ── 「🔗 说明」：插入悬停说明（或替换被双击编辑的旧链接） ──
  // 光标位置基于 contenteditable 的纯文本偏移；真源始终是隐藏 textarea
  function ideaEdCaretPos() {
    var sel = window.getSelection && window.getSelection();
    if (!sel || sel.rangeCount === 0) return -1;
    var range = sel.getRangeAt(0);
    var ed = ideaEditorEl();
    if (!ed || !ed.contains(range.startContainer)) return -1;
    var pre = document.createRange();
    pre.selectNodeContents(ed);
    pre.setEnd(range.startContainer, range.startOffset);
    return pre.toString().length;
  }
  function ideaInsertLink(label, tip) {
    if (ideaMode !== 'edit') { ideasExitPen(); }
    // 方案A：插入前确保在编辑会话（渲染视图 → 纯文本视图，光标在末尾），
    // 插入后保持编辑会话（不渲染），用户可继续输入，失焦后渲染出链接
    if (ideaView !== 'edit') ideaEnterEditView(-1);
    var ta = document.getElementById('ideasTextarea');
    var snippet = tip ? ('[[' + label + '|' + tip + ']]') : ('[[' + label + ']]');
    var val = ta.value || '';
    var start, end, caret;
    if (ideaEditTarget && ideaEditTarget.start >= 0 &&
        ideaEditTarget.end >= ideaEditTarget.start &&
        ideaEditTarget.end <= val.length) {
      // 替换被双击编辑的旧链接
      start = ideaEditTarget.start; end = ideaEditTarget.end;
      caret = start + snippet.length;
    } else {
      // 普通插入：插到 contenteditable 光标处的纯文本偏移
      var cp = ideaEdCaretPos();
      start = (cp >= 0) ? cp : val.length;
      end = start;
      caret = start + snippet.length;
    }
    ta.value = val.slice(0, start) + snippet + val.slice(end);
    ideaEditTarget = null;   // 用完即清
    ideasSavePage();
    // 编辑会话内同步纯文本视图并放光标（不渲染，避免打断输入）
    var ed = ideaEditorEl();
    var html = '';
    var ls = ta.value.split('\n');
    for (var i = 0; i < ls.length; i++) html += '<div>' + escapeHtml(ls[i]) + '</div>';
    ed.innerHTML = html;
    ed.focus();
    ideaRestoreCaret(caret);
  }

  function upgradeKnownSchedule(data) {
    var signature = data.courses.map(function(course) { return stableStringify(course); }).sort().join('\n');
    if (LEGACY_SCHEDULE_SIGNATURES.indexOf(signature) === -1) return false;
    data.courses = JSON.parse(JSON.stringify(DEFAULT_COURSES));
    if (!data.notes) data.notes = DEFAULT_SCHEDULE_NOTES;
    else if (data.notes.indexOf(CONFIRMED_CONTINUATION_NOTE) === -1) data.notes += '\n' + CONFIRMED_CONTINUATION_NOTE;
    return true;
  }

  function createDefaultSchedule() {
    return { semesterStart: SEMESTER_START, timeSlots: JSON.parse(JSON.stringify(DEFAULT_TIME_SLOTS)),
      courses: JSON.parse(JSON.stringify(DEFAULT_COURSES)), notes: DEFAULT_SCHEDULE_NOTES };
  }

  function loadScheduleData() {
    try {
      var raw = localStorage.getItem(SCHEDULE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        // 结构校验：必须有 courses 数组
        if (parsed && Array.isArray(parsed.courses) && Array.isArray(parsed.timeSlots)) {
          scheduleData = parsed;
          if (upgradeKnownSchedule(scheduleData)) {
            saveScheduleData();  // saveWithBackup 在覆盖前保留原记录
          }
        } else {
          // 数据格式不兼容，备份旧数据然后迁移
          var backupKey = SCHEDULE_KEY + '_backup_' + Date.now();
          localStorage.setItem(backupKey, raw);
          console.warn('Schedule data format incompatible, backed up to ' + backupKey);
          scheduleData = createDefaultSchedule();
          saveScheduleData();
        }
      } else {
        scheduleData = createDefaultSchedule();
        saveScheduleData();
      }
    } catch(e) {
      // 解析失败，备份旧数据
      try {
        var raw2 = localStorage.getItem(SCHEDULE_KEY);
        if (raw2) localStorage.setItem(SCHEDULE_KEY + '_backup_' + Date.now(), raw2);
      } catch(e2) {}
      scheduleData = createDefaultSchedule();
      saveScheduleData();
      console.warn('Schedule data parse error, reset to defaults. Old data backed up.');
    }
  }

  function saveScheduleData() {
    saveWithBackup(SCHEDULE_KEY, JSON.stringify(scheduleData));
  }

  function getWeekStartDate(weekNum) {
    if (!scheduleData || !scheduleData.semesterStart) return new Date();
    var base = new Date(scheduleData.semesterStart + 'T00:00:00');
    base.setDate(base.getDate() + (weekNum - 1) * 7);
    return base;
  }

  function getCurrentWeek() {
    if (!scheduleData || !scheduleData.semesterStart) return 1;
    var today = new Date(todayStr() + 'T00:00:00');
    var base = new Date(scheduleData.semesterStart + 'T00:00:00');
    var diff = today - base;
    var week = Math.floor(diff / (7 * 86400000)) + 1;
    if (week < 1) week = 1;
    return week;
  }

  function formatDateMD(dateStr) {
    var parts = dateStr.split('-');
    return parseInt(parts[1], 10) + '/' + parseInt(parts[2], 10);
  }

  function getWeekDates(weekNum) {
    var start = getWeekStartDate(weekNum);
    var dates = [];
    for (var i = 0; i < 7; i++) {
      var d = new Date(start);
      d.setDate(d.getDate() + i);
      dates.push(localDateStr(d));
    }
    return dates;
  }

  function renderScheduleTable(weekNum) {
    if (!scheduleData || !scheduleData.timeSlots) return;
    currentScheduleWeek = weekNum;
    var table = document.getElementById('scheduleTable');
    var weekDates = getWeekDates(weekNum);
    var today = todayStr();

    // 周标签
    var weekStart = getWeekStartDate(weekNum);
    var weekEnd = new Date(weekStart);
    weekEnd.setDate(weekEnd.getDate() + 6);
    document.getElementById('schedWeekLabel').textContent =
      '第' + weekNum + '周  (' + formatDateMD(weekDates[0]) + ' ~ ' + formatDateMD(weekDates[6]) + ')';

    var dayNames = ['周一','周二','周三','周四','周五','周六','周日'];
    var timeSlots = scheduleData.timeSlots;

    // 表头
    var html = '<thead><tr><th class="time-col">时间</th>';
    for (var d = 0; d < 7; d++) {
      var dayCls = weekDates[d] === today ? ' today-col' : '';
      html += '<th class="' + dayCls + '">' + dayNames[d] + '<br><small>' + formatDateMD(weekDates[d]) + '</small></th>';
    }
    html += '</tr></thead><tbody>';

    // 每行一个时间段
    for (var s = 0; s < timeSlots.length; s++) {
      var ts = timeSlots[s];
      html += '<tr>';
      html += '<td class="time-col"><strong>' + ts.name + '</strong><div class="time-sub">' + ts.sub + '</div><div class="time-sub">' + ts.time + '</div></td>';
      for (var d = 0; d < 7; d++) {
        var cellCls = weekDates[d] === today ? ' today-col' : '';
        html += '<td class="' + cellCls + '" data-day="' + (d+1) + '" data-slot="' + s + '">';
        // 查找该格子（星期d+1, 时间段s）的课程
        var cellCourses = [];
        for (var c = 0; c < scheduleData.courses.length; c++) {
          var cr = scheduleData.courses[c];
          if (cr.day === (d+1) && cr.slot === s && scheduleCourseHasWeek(cr, weekNum)) {
            cellCourses.push(cr);
          }
        }
        for (var cc = 0; cc < cellCourses.length; cc++) {
          var cr2 = cellCourses[cc];
          var scMeta = (cr2.teacher ? escapeHtml(cr2.teacher) + ' · ' : '') +
            escapeHtml(scheduleWeeksLabel(cr2)) + '周';
          html += '<div class="schedule-course">' +
            '<div class="sc-name">' + escapeHtml(cr2.name) + '</div>' +
            '<div class="sc-location">📌 ' + escapeHtml(cr2.location) + '</div>' +
            '<div class="sc-meta">' + scMeta + '</div>' +
            '</div>';
        }
        html += '</td>';
      }
      html += '</tr>';
    }
    html += '</tbody>';
    table.innerHTML = html;
    var notes = document.getElementById('scheduleNotes');
    notes.textContent = scheduleData.notes ? '课表备注\n' + scheduleData.notes : '';
    notes.style.display = scheduleData.notes ? '' : 'none';
  }

  function showSchedule() {
    scheduleVisible = true;
    document.querySelector('.layout').style.display = 'none';
    document.getElementById('scheduleOverlay').classList.add('show');
    document.getElementById('floatScheduleBtn').textContent = '📋 返回主页';
    currentScheduleWeek = getCurrentWeek();
    renderScheduleTable(currentScheduleWeek);
  }

  function hideSchedule() {
    scheduleVisible = false;
    document.querySelector('.layout').style.display = '';
    document.getElementById('scheduleOverlay').classList.remove('show');
    document.getElementById('floatScheduleBtn').textContent = '📅 切换至课表';
  }

  document.getElementById('floatScheduleBtn').addEventListener('click', function() {
    if (scheduleVisible) { hideSchedule(); } else { showSchedule(); }

  document.getElementById('schedBackBtn').addEventListener('click', hideSchedule);
  document.getElementById('schedModeToggle').addEventListener('click', toggleScheduleMode);

  // 周导航
  document.getElementById('schedPrevWeek').addEventListener('click', function() {
    if (currentScheduleWeek > 1) renderScheduleTable(currentScheduleWeek - 1);

  document.getElementById('schedNextWeek').addEventListener('click', function() {
    renderScheduleTable(currentScheduleWeek + 1);
  });

  // 文件导入课表（JSON 或 XLS）
  // weeks 是实际开课周次；startWeek/endWeek 保留用于兼容旧课表。
  function scheduleCourseHasWeek(course, week) {
    if (Array.isArray(course.weeks)) return course.weeks.indexOf(Number(week)) !== -1;
    return course.startWeek <= week && course.endWeek >= week;
  }

  function scheduleWeeksLabel(course) {
    if (!Array.isArray(course.weeks)) {
      return course.startWeek + (course.startWeek === course.endWeek ? '' : '-' + course.endWeek);
    }
    var groups = [], weeks = course.weeks;
    for (var i = 0; i < weeks.length; i++) {
      var first = weeks[i], last = first;
      while (i + 1 < weeks.length && weeks[i + 1] === last + 1) last = weeks[++i];
      groups.push(first === last ? String(first) : first + '-' + last);
    }
    return groups.join(',');
  }

  function parseScheduleWeeks(text) {
    var weeks = [];
    String(text).split(/[,，、]/).forEach(function(part) {
      var m = part.trim().match(/^(\d+)(?:\s*[-~～—–]\s*(\d+))?$/);
      if (!m) throw new Error('无法识别周次：' + text);
      var first = Number(m[1]), last = m[2] ? Number(m[2]) : first;
      if (first < 1 || last < first || last - first > 1000) throw new Error('周次范围无效：' + text);
      for (var w = first; w <= last; w++) if (weeks.indexOf(w) === -1) weeks.push(w);
    });
    return weeks.sort(function(a, b) { return a - b; });
  }

  function parseOneCourse(text) {
    var m = String(text).trim().match(/^(.+?)\s*\[([^\]]*)\]\s*([\d\s,，、~～—–-]+)周\s*[;；]\s*([\s\S]*)$/);
    if (!m) return null;
    var weeks = parseScheduleWeeks(m[3]);
    return { name: m[1].trim(), teacher: m[2].trim(), weeks: weeks,
      startWeek: weeks[0], endWeek: weeks[weeks.length - 1], location: m[4].trim() };
  }

  function parseCourseCell(cellText) {
    var text = String(cellText || '').replace(/\r\n?/g, '\n').trim();
    if (!text) return [];
    // 按完整的“课程名[教师]”边界切分，不在名称的每个汉字前切开。
    var re = /(?:^|\s)[^\s\[\];；]+\s*\[[^\]\r\n]*\]/g;
    var starts = [], m;
    while ((m = re.exec(text)) !== null) starts.push(m.index);
    if (!starts.length || text.slice(0, starts[0]).trim()) throw new Error('未识别课程：' + text.slice(0, 60));
    return starts.map(function(pos, idx) {
      var part = text.slice(pos, idx + 1 < starts.length ? starts[idx + 1] : text.length);
      var course = parseOneCourse(part);
      if (!course) throw new Error('未识别课程或周次：' + part.trim().slice(0, 60));
      return course;
    });
  }

  // 原 Excel 未标明跨度。仅对完整匹配的已知课表应用用户确认的第8周周六连堂。
  function applyConfirmedContinuation(courses) {
    var signature = courses.map(function(course) { return stableStringify(course); }).sort().join('\n');
    if (signature !== CONFIRMED_CONTINUATION_SOURCE) return false;
    courses.push({"name":"嵌入式系统原理","teacher":"李文超副教授","weeks":[8],"startWeek":8,"endWeek":8,"location":"成栋楼820","day":6,"slot":3});
    return true;
  }

  function parseScheduleTable(rows, fallbackSlots) {
    if (!Array.isArray(rows)) throw new Error('课表必须是二维表格');
    var dayChars = '一二三四五六日', columns = [], header = -1;
    for (var r = 0; r < rows.length; r++) {
      if (!Array.isArray(rows[r])) continue;
      var found = [];
      rows[r].forEach(function(cell, col) {
        var match = String(cell).replace(/\s/g, '').match(/^(?:星期|周|礼拜)([一二三四五六日天])$/);
        if (match) found.push({ col: col, day: match[1] === '天' ? 7 : dayChars.indexOf(match[1]) + 1 });
      });
      if (found.length >= 2) { header = r; columns = found; break; }
    }
    if (header < 0) throw new Error('未找到星期一至星期日的课表表头');
    var seenDays = {};
    columns.forEach(function(c) {
      if (seenDays[c.day]) throw new Error('课表中存在重复的星期列');
      seenDays[c.day] = true;
    });
    var slots = (fallbackSlots || DEFAULT_TIME_SLOTS).map(function(slot) {
      return { name: slot.name, sub: slot.sub, time: slot.time };
    });
    var courses = [], notes = [], seenSlots = {};
    for (var row = header + 1; row < rows.length; row++) {
      var cells = rows[row];
      if (!Array.isArray(cells)) continue;
      var joined = cells.map(function(c) { return String(c || '').trim(); }).filter(Boolean).join('\n');
      if (/^备注[:：]/.test(joined)) { notes.push(joined.replace(/^备注[:：]\s*/, '')); continue; }
      if (!joined) continue;
      var label = cells.slice(0, columns[0].col).join('\n');
      var slot = -1;
      for (var s = 0; s < DEFAULT_TIME_SLOTS.length; s++) {
        if (label.indexOf(DEFAULT_TIME_SLOTS[s].name) !== -1 || label.indexOf(DEFAULT_TIME_SLOTS[s].sub) !== -1) {
          slot = s; break;
        }
      }
      if (slot < 0) throw new Error('第 ' + (row + 1) + ' 行未识别节次：' + label.trim());
      if (seenSlots[slot]) throw new Error('课表中存在重复节次：' + slots[slot].name);
      seenSlots[slot] = true;
      var time = label.match(/(\d{1,2}:\d{2})\s*[~～—–-]\s*(\d{1,2}:\d{2})/);
      if (time) slots[slot].time = time[1] + '~' + time[2];
      columns.forEach(function(col) {
        try {
          parseCourseCell(cells[col.col]).forEach(function(course) {
            course.day = col.day;
            course.slot = slot;
            courses.push(course);
          });
        } catch (err) {
          throw new Error('第 ' + (row + 1) + ' 行，星期' + dayChars[col.day - 1] + '：' + err.message);
        }
      });
    }
    if (!courses.length) throw new Error('课表中没有可导入的上课安排');
    if (applyConfirmedContinuation(courses)) notes.push(CONFIRMED_CONTINUATION_NOTE);
    return { courses: courses, timeSlots: slots, notes: notes.join('\n') };
  }

  function parseScheduleJSON(rows) {
    return parseScheduleTable(rows).courses;
  }

  // 先完整解析再替换；任何格子失败都保留原课表。
  function applyImportedSchedule(parsed) {

  function importFromJSONFile(file) {

        applyImportedSchedule(parseScheduleTable(rows, scheduleData.timeSlots));
      } catch(err) {
        alert('JSON解析失败：' + err.message);
      }
    };
    reader.readAsText(file, 'UTF-8');
  }

  function importFromXLSFile(file) {
    if (typeof XLSX === 'undefined') {
      // SheetJS 未加载（离线），回退到脚本方案
      alert('SheetJS 库未加载（可能离线）。\n\n请使用同目录下的 convert_xls.py 脚本转换：\n1. 命令行运行：python convert_xls.py "课表打印.xls"\n2. 生成 课表数据.json\n3. 再点击导入，选择 .json 文件\n\n或者联网刷新页面后直接导入 .xls/.xlsx。');
      return;
    }
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var data = new Uint8Array(e.target.result);
        var wb = XLSX.read(data, { type: 'array' });
        var ws = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
        applyImportedSchedule(parseScheduleTable(rows, scheduleData.timeSlots));
      } catch(err) {
        alert('课表文件解析失败：' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  /* ═══════════════════════════════════════════
   *  托盘球同步（可选功能）
   *  ── 数据推送到本机 127.0.0.1:8899，供桌面托盘球读取展示
   *  ── 托盘球未运行时静默失败，不影响页面正常使用
   *  ═══════════════════════════════════════════ */
  var TRAY_SYNC_URL = 'http://127.0.0.1:8899/api/sync';
  var TRAY_FULL_URL = 'http://127.0.0.1:8899/api/full';
  var traySyncTimer = null;
  var trayLastPayload = '';
  var trayPullBusy = false;

  // 收集所有需要同步的 localStorage 数据
  function collectTrayPayload() {
    var keys = [TODO_KEY, DATE_KEY, PLAN_KEY, TODAY_KEY, MODE_KEY, PLAN_MODE_KEY,
                WORKLOG_KEY, TOMORROW_KEY, TOMORROW_DISMISS, SCHEDULE_KEY, IDEAS_KEY, DELETED_KEY];
    var payload = {};
    keys.forEach(function(k) {
      try {
        var v = localStorage.getItem(k);
        if (v !== null && v !== undefined) payload[k] = v;
      } catch(e) {}
    });
    return payload;
  }

  // ── JSON 容错 / 合并工具 ──
  function parseJsonArray(raw) {
    try {
      var v = JSON.parse(raw || '[]');
      return Array.isArray(v) ? v : [];
    } catch(e) { return []; }
  }

  function parseJsonObject(raw) {
    try {
      var v = JSON.parse(raw || '{}');
      return (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};
    } catch(e) { return {}; }
  }

  // 稳定序列化：仅用于比较（普通 JSON.stringify 的键顺序不稳定）
  function stableStringify(v) {
    if (v === null || typeof v !== 'object') return JSON.stringify(v);
    if (Array.isArray(v)) return '[' + v.map(stableStringify).join(',') + ']';
    return '{' + Object.keys(v).sort().map(function(k) {
      return JSON.stringify(k) + ':' + stableStringify(v[k]);
    }).join(',') + '}';
  }

  // 合并墓碑 {任务id: 删除时间戳}，同 id 取较新
  function mergeDeletedMaps(a, b) {
    var out = {};
    Object.keys(a || {}).forEach(function(k) { out[k] = Number(a[k]) || 0; });
    Object.keys(b || {}).forEach(function(k) {
      var t = Number(b[k]) || 0;
      if (!(k in out) || t > out[k]) out[k] = t;
    });
    return out;
  }

  // 合并任务列表：按 id + updatedAt 裁决；本地缺失的任务追加进来
  function mergeRemoteTodos(local, remote) {
    var byId = {}, order = [];
    (local || []).forEach(function(t) {
      if (t && t.id) { byId[t.id] = t; order.push(t.id); }
    });
    (remote || []).forEach(function(t) {
      if (!t || !t.id) return;
      var old = byId[t.id];
      if (!old) {
        byId[t.id] = t;
        order.push(t.id);
        return;
      }
      var ru = Number(t.updatedAt) || 0;
      var lu = Number(old.updatedAt) || 0;
      if (ru > lu) byId[t.id] = t;   // 时间相同保留本地
    });
    return order.map(function(id) { return byId[id]; });
  }

  // 合并服务端思路（按日期 ts，较新者胜），返回是否有变化
  function mergeRemoteIdeas(raw) {
    var remote = parseJsonObject(raw);
    var local = parseJsonObject(localStorage.getItem(IDEAS_KEY));
    var changed = false;
    Object.keys(remote).forEach(function(date) {
      var rv = remote[date], lv = local[date];
      if (!lv || ((rv && rv.ts) || 0) > ((lv && lv.ts) || 0)) {
        local[date] = rv;
        changed = true;
      }
    });
    if (changed) localStorage.setItem(IDEAS_KEY, JSON.stringify(local));
    return changed;
  }

  // 已删除任务从各日期的“今日”映射中清理掉
  function cleanupTodayDeleted(delMap) {
    var changed = false;
    Object.keys(todayData).forEach(function(date) {
      var arr = todayData[date];
      if (!Array.isArray(arr)) return;
      var filtered = arr.filter(function(id) { return !(id in delMap); });
      if (filtered.length !== arr.length) {
        changed = true;
        if (filtered.length) todayData[date] = filtered;
        else delete todayData[date];
      }
    });
    if (changed) saveTodayData();
  }

  function isTodoEditing() {
    var el = document.activeElement;
    return !!(el && todoList && todoList.contains(el) &&
              /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
  }

  function isIdeasEditing() {
    var el = document.activeElement;
    if (ideaView === 'edit' || (el && el.id === 'ideasTextarea')) return true;
    // 标记模式下编辑框是隐藏的、永远拿不到焦点，涂抹过程中若被拉取刷新会丢笔画；
    // 因此把「正在涂抹」以及「停留在标记模式」也视为编辑中，跳过思路刷新。
    if (penStroke) return true;
    if (ideaMode === 'pen') return true;
    return false;
  }

  function pullFromTray() {
    // 一次拉全量：任务（含手机新增）、删除墓碑、思路、seq
    // 正在编辑任务详情时不拉取，避免打断输入
    if (isTodoEditing() || trayPullBusy) return;
    trayPullBusy = true;
    try {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', TRAY_FULL_URL, true);
      xhr.timeout = 4000;
      xhr.onload = function() {
        trayPullBusy = false;
        if (xhr.status !== 200) return;
        try {
          var d = JSON.parse(xhr.responseText);
          var rd = (d && d.data) || null;
          if (!rd) return;

          var oldDel = parseJsonObject(localStorage.getItem(DELETED_KEY));
          var delMap = mergeDeletedMaps(oldDel, parseJsonObject(rd.my_deleted));
          var merged = mergeRemoteTodos(todos, parseJsonArray(rd.my_todo_list_v2));
          var kept = merged.filter(function(t) {
            return !(t && t.id in delMap);   // 墓碑终局：删除不复活
          });

          var todosChanged = stableStringify(kept) !== stableStringify(todos);
          var delChanged = stableStringify(delMap) !== stableStringify(oldDel);

          if (delChanged) {
            localStorage.setItem(DELETED_KEY, JSON.stringify(delMap));
          }
          if (todosChanged) {
            todos = kept;
            saveTodos();
            safeCall(renderTodos, 'pull-renderTodos');
            safeCall(updateSummary, 'pull-updateSummary');
            safeCall(updateGlobal, 'pull-updateGlobal');
          }
          if (todosChanged || delChanged) cleanupTodayDeleted(delMap);

          var ideasChanged = !isIdeasEditing() && mergeRemoteIdeas(rd.my_ideas);
          if (ideasChanged && !isIdeasEditing()) {
            safeCall(function() { ideasLoadPage(ideasCurrentDate); }, 'pull-ideas');
          }
          // 本地有变化就强制回推一次，让服务端收敛
          if (todosChanged || delChanged || ideasChanged) trayLastPayload = '';
        } catch(e) {}
      };
      xhr.onerror = function() { trayPullBusy = false; };
      xhr.ontimeout = function() { trayPullBusy = false; };
      xhr.send();
    } catch(e) {
      trayPullBusy = false;
    }
  }

  function syncToTray() {
    try {
      var payload = collectTrayPayload();
      var text = JSON.stringify(payload);
      if (text === trayLastPayload) return; // 内容无变化，不重复发送
      var xhr = new XMLHttpRequest();
      xhr.open('POST', TRAY_SYNC_URL, true);
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.onload = function() {
        if (xhr.status === 200) trayLastPayload = text;
      };
      xhr.onerror = function() { /* 托盘球未运行，静默 */ };
      xhr.send(text);
    } catch(e) { /* 静默 */ }
  }

  function startTraySync() {
    // 页面打开先同步一次，之后每 8 秒拉取 + 推送
    setTimeout(syncToTray, 1200);
    traySyncTimer = setInterval(function() {
      pullFromTray();
      syncToTray();
    }, 8000);
    // 页面重新可见时立即同步
    document.addEventListener('visibilitychange', function() {
      if (!document.hidden) {
        pullFromTray();
        syncToTray();
      }
    });
  }

  /* ═══════════════════════════════════════════
   *  启动（每一步独立 try-catch，确保单模块异常不影响其他模块）
   * ═══════════════════════════════════════════ */
  function safeCall(fn, label) {
    try { fn(); } catch(e) { console.error('Startup error [' + label + ']:', e); }
  }
  safeCall(loadTodos, 'loadTodos');
  safeCall(migrateTodoIds, 'migrateTodoIds');
  safeCall(loadTodayData, 'loadTodayData');
  safeCall(loadTodayMode, 'loadTodayMode');
  safeCall(loadDates, 'loadDates');
  safeCall(loadPlans, 'loadPlans');
  safeCall(loadPanelMode, 'loadPanelMode');
  safeCall(loadScheduleData, 'loadScheduleData');
  safeCall(loadScheduleMode, 'loadScheduleMode');
  safeCall(updateScheduleModeUI, 'updateScheduleModeUI');
  safeCall(loadWorklog, 'loadWorklog');
  safeCall(loadTomorrow, 'loadTomorrow');
  safeCall(loadIdeas, 'loadIdeas');
  safeCall(startTraySync, 'startTraySync');
  worklogActive = todayStr();
  safeCall(function() { document.getElementById('dateInput').value = todayStr(); }, 'setDateInput');
  safeCall(updateModeUI, 'updateModeUI');
  safeCall(updatePanelUI, 'updatePanelUI');
  safeCall(renderTodos, 'renderTodos');
  safeCall(renderDates, 'renderDates');
  safeCall(renderWorklogTabs, 'renderWorklogTabs');
  safeCall(renderWorklogContent, 'renderWorklogContent');
  safeCall(renderTomorrow, 'renderTomorrow');
  // 初始化迷你日历
  var now = new Date();
  calState.year = now.getFullYear();
  calState.month = now.getMonth() + 1;
  if (isPlanMode) safeCall(renderMiniCalendar, 'renderMiniCalendar');
  // 模式切换按钮
  safeCall(function() { document.getElementById('modeToggle').addEventListener('click', toggleMode); }, 'bindModeToggle');
  // 延迟弹出，让页面先渲染完
  safeCall(function() { setTimeout(checkTomorrowModal, 300); }, 'scheduleModal');
  // 检测备份数据
  safeCall(function() {
    var backupKeys = [TODO_KEY, DATE_KEY, PLAN_KEY, WORKLOG_KEY];
    var found = [];
    backupKeys.forEach(function(k) {
      var backups = getBackups(k);
      if (backups.length > 0) found.push({ key: k, count: backups.length, backups: backups });
    });
    if (found.length === 0) return;
    // 显示恢复横幅
    var banner = document.getElementById('restoreBanner');
    var textEl = document.getElementById('restoreBannerText');
    var labels = found.map(function(f) {
      var short = f.key.replace('my_', '').replace('_v2', '');
      return short + '(' + f.count + '份)';
    });
    textEl.textContent = '🔧 发现备份数据：' + labels.join(', ') + ' — 可能包含之前丢失的内容';
    banner.style.display = 'flex';

    document.getElementById('restoreBannerBtn').addEventListener('click', function() {
      var restored = 0;
      found.forEach(function(f) {
        if (restoreFromBackup(f.key, 0)) restored++;
      });
      if (restored > 0) {
        alert('已恢复 ' + restored + ' 项数据，页面将刷新。');
        location.reload();
      } else {
        alert('恢复失败，请查看控制台。');
      }
    });

    document.getElementById('restoreBannerDismiss').addEventListener('click', function() {
      banner.style.display = 'none';
    });
  }, 'checkBackups');
  // 导出全部数据
  safeCall(function() {
    document.getElementById('exportAllBtn').addEventListener('click', function() {
      var allData = {};
      [TODO_KEY, DATE_KEY, PLAN_KEY, TODAY_KEY, MODE_KEY, PLAN_MODE_KEY,
       WORKLOG_KEY, TOMORROW_KEY, TOMORROW_DISMISS, SCHEDULE_KEY,
       DELETED_KEY, IDEAS_KEY].forEach(function(k) {
        var v = localStorage.getItem(k);
        if (v !== null && v !== undefined) allData[k] = v;
      });
      var blob = new Blob([JSON.stringify(allData, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'todo_backup_' + todayStr() + '.json';
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('importAllBtn').addEventListener('click', function() {
      document.getElementById('importAllFile').click();
    });

    document.getElementById('importAllFile').addEventListener('change', function(e) {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev) {
        try {
          var data = JSON.parse(ev.target.result);
          if (!data || typeof data !== 'object') { alert('文件格式无效'); return; }
          var keys = Object.keys(data);
          if (keys.length === 0) { alert('文件中没有数据'); return; }
          if (!confirm('将导入 ' + keys.length + ' 个数据项，当前数据会被覆盖。\n\n建议先点击「📤 导出」保存当前数据。\n\n确认导入？')) return;
          var imported = 0;
          keys.forEach(function(k) {
            try {
              saveWithBackup(k, data[k]);
              imported++;
            } catch(e) { console.error('导入失败:', k, e); }
          });
          alert('已导入 ' + imported + ' 项。页面将刷新。');
          location.reload();
        } catch(err) {
          alert('文件解析失败：' + err.message);
        }
      };
      reader.readAsText(file, 'UTF-8');
      e.target.value = '';
    });
  }, 'bindExportImport');

  // 启动诊断：打印所有 localStorage 数据概况
  safeCall(function() {
    console.log('═══ localStorage 数据诊断 ═══');
    var keys = ['my_todo_list_v2','my_date_notes','my_date_plans','my_today_data',
                'my_today_mode','my_panel_mode','my_worklog','my_tomorrow_msg',
                'my_tomorrow_dismiss','my_schedule_data'];
    keys.forEach(function(k) {
      try {
        var raw = localStorage.getItem(k);
        if (!raw) { console.log(k + ': (空)'); return; }
        var v;
        try { v = JSON.parse(raw); } catch(e) { v = raw; }
        if (Array.isArray(v)) {
          console.log(k + ': 数组, ' + v.length + ' 条', v.slice(0, 3));
        } else if (v && typeof v === 'object') {
          console.log(k + ': 对象, keys=' + Object.keys(v).length, v);
        } else {
          console.log(k + ': ' + typeof v, v);
        }
      } catch(e) { console.log(k + ': 读取失败 - ' + e.message); }
    });
    console.log('═══ 诊断完毕 ═══');
  }, 'diagnostics');
  // 自动周一切换检测
  var lastScheduleWeek = getCurrentWeek();
  safeCall(function() {
    setInterval(function() {
      if (scheduleVisible) {
        var w = getCurrentWeek();
        if (w !== lastScheduleWeek) {
          lastScheduleWeek = w;
          currentScheduleWeek = w;
          renderScheduleTable(w);
        }
      }
    }, 60000);
  }, 'scheduleWeekCheck');
})();
</script>
